<style>
:root {
  --tlo: #f4f4f1;
  --karta: #ffffff;
  --tekst: #16160f;
  --szary: #6b6a63;
  --linia: #e4e2dc;
  --linia-mocna: #cfccc4;
  --akcent: #ffc400;
  --akcent-ciemny: #e0ac00;
  --ciemny: #16160f;
  --czerwony: #c8281c;
  --czerwony-tlo: #fdeeec;
  --pomarancz: #b45309;
  --pomarancz-tlo: #fff4e0;
  --zielony: #157a3c;
  --zielony-tlo: #e8f6ed;
  --niebieski: #1d4f91;
  --niebieski-tlo: #eaf1fb;
  --promien: 12px;
  --cien: 0 1px 2px rgba(22, 22, 15, .06), 0 2px 8px rgba(22, 22, 15, .04);
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  color: var(--tekst);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.nowrap { white-space: nowrap; }
html, body { margin: 0; height: 100%; background: var(--tlo); }
body { line-height: 1.45; }
h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.01em; }
h2 { font-size: 16px; margin: 0 0 12px; }
h3 { font-size: 14px; margin: 16px 0 8px; }
a { color: var(--niebieski); }
p { margin: 0 0 10px; }
.szary { color: var(--szary); }
.maly { font-size: 12px; }
.mono { font-family: "Cascadia Mono", Consolas, "SF Mono", monospace; font-size: 12.5px; }
.ukryty { display: none; }
.czerwony-tekst { color: var(--czerwony); }
.blad-tekst { color: var(--czerwony); display: block; margin-top: 4px; }
.odstep-gora { margin-top: 20px; }
.ik { width: 18px; height: 18px; flex: none; vertical-align: -4px; }

/* przyciski */
.przycisk {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--linia-mocna); background: var(--karta);
  color: var(--tekst); border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: background .12s, border-color .12s, box-shadow .12s;
}
.przycisk:hover { border-color: var(--tekst); }
.przycisk:focus-visible, .ikonowy:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, tr[data-a]:focus-visible { outline: 2px solid var(--akcent-ciemny); outline-offset: 1px; }
.przycisk.glowny { background: var(--akcent); border-color: var(--akcent); color: var(--ciemny); }
.przycisk.glowny:hover { background: var(--akcent-ciemny); border-color: var(--akcent-ciemny); }
.przycisk.czerwony { background: var(--czerwony); border-color: var(--czerwony); color: #fff; }
.przycisk.czerwony-tekst { color: var(--czerwony); border-color: transparent; background: transparent; margin-right: auto; }
.przycisk.tekstowy { border-color: transparent; background: transparent; }
.przycisk.tekstowy:hover { background: rgba(22, 22, 15, .05); }
.przycisk.duzy { padding: 12px 18px; font-size: 15px; width: 100%; justify-content: center; }
.przycisk.maly { padding: 4px 10px; font-size: 12.5px; }
.przycisk:disabled { opacity: .45; cursor: not-allowed; }
.ikonowy { border: 0; background: transparent; padding: 6px; border-radius: 6px; cursor: pointer; color: var(--szary); }
.ikonowy:hover { background: rgba(22, 22, 15, .06); color: var(--tekst); }

/* ekran startowy */
.start { min-height: 100%; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 0%, #fff7d6 0, transparent 45%), var(--tlo); }
.karta-startowa { width: 100%; max-width: 440px; background: var(--karta); border-radius: 18px; padding: 36px; box-shadow: 0 10px 40px rgba(22, 22, 15, .08); display: flex; flex-direction: column; gap: 12px; }
.karta-startowa h1 { font-size: 30px; }
.logo-start { height: 34px; align-self: flex-start; margin-bottom: 8px; }
.separator { display: flex; align-items: center; gap: 12px; color: var(--szary); font-size: 12px; margin: 6px 0; }
.separator::before, .separator::after { content: ""; flex: 1; border-top: 1px solid var(--linia); }
.lista-osob { display: grid; gap: 8px; }
.osoba { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--linia); border-radius: 10px; background: var(--karta); cursor: pointer; font: inherit; font-weight: 600; text-align: left; }
.osoba:hover { border-color: var(--tekst); }
.awatar { width: 30px; height: 30px; border-radius: 50%; background: var(--akcent); display: inline-grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }

/* układ */
.uklad { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
.boczny { background: var(--ciemny); color: #ecebe6; display: flex; flex-direction: column; padding: 18px 12px; gap: 14px; overflow-y: auto; }
.marka { display: flex; align-items: center; gap: 10px; padding: 2px 8px 6px; }
.marka img { height: 26px; background: #fff; padding: 4px 8px; border-radius: 6px; }
.marka span { font-weight: 600; color: var(--akcent); }
.szybkie { display: grid; gap: 6px; padding: 0 4px; }
.szybkie .przycisk { justify-content: flex-start; }
.szybkie .przycisk:not(.glowny) { background: transparent; color: #ecebe6; border-color: #45443d; }
.szybkie .przycisk:not(.glowny):hover { border-color: #ecebe6; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: #cfcdc6; text-decoration: none; font-weight: 500; }
nav a:hover { background: rgba(255, 255, 255, .06); color: #fff; }
nav a.aktywny { background: rgba(255, 196, 0, .14); color: #fff; }
nav a.aktywny .ik { color: var(--akcent); }
nav hr { border: 0; border-top: 1px solid #34332d; margin: 8px 4px; }
.licznik { margin-left: auto; background: #45443d; color: #fff; border-radius: 10px; padding: 0 7px; font-size: 11.5px; font-weight: 700; }
.licznik.czerwony { background: var(--czerwony); }
.glowna { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.gora { display: flex; align-items: center; gap: 8px; padding: 10px 24px; border-bottom: 1px solid var(--linia); background: var(--karta); }
.odstep { flex: 1; }
.uzytkownik { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--linia); background: var(--karta); border-radius: 20px; padding: 3px 12px 3px 3px; font: inherit; font-weight: 600; cursor: pointer; }
.uzytkownik:hover { border-color: var(--tekst); }
.zawartosc { flex: 1; overflow-y: auto; padding: 24px; }
.zawartosc > * { max-width: 1280px; }
.wstecz { margin: -8px 0 6px -14px; }
.naglowek-widoku { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.naglowek-widoku .przyciski { display: flex; gap: 8px; flex-wrap: wrap; }

/* karty i kafle */
.karta { background: var(--karta); border: 1px solid var(--linia); border-radius: var(--promien); padding: 18px; margin-bottom: 16px; box-shadow: var(--cien); }
.dwie-kolumny { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.kafle { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kafel { text-align: left; background: var(--karta); border: 1px solid var(--linia); border-radius: var(--promien); padding: 14px 16px; cursor: pointer; font: inherit; box-shadow: var(--cien); display: flex; flex-direction: column; gap: 2px; }
.kafel:hover { border-color: var(--tekst); }
.kafel b { font-size: 26px; letter-spacing: -.02em; }
.kafel span { color: var(--szary); font-size: 12.5px; }
.kafel.czerwony { border-color: #f0b8b2; background: var(--czerwony-tlo); }
.kafel.czerwony b { color: var(--czerwony); }
.kafel.pomaranczowy b { color: var(--pomarancz); }
.szybkie-duze { display: grid; gap: 8px; }
.akcja-duza { display: grid; grid-template-columns: 28px 1fr; grid-template-rows: auto auto; column-gap: 10px; text-align: left; padding: 12px; border: 1px solid var(--linia); border-radius: 10px; background: var(--karta); cursor: pointer; font: inherit; }
.akcja-duza:hover { border-color: var(--tekst); }
.akcja-duza .ik { grid-row: span 2; width: 22px; height: 22px; margin-top: 2px; }
.akcja-duza span { color: var(--szary); font-size: 12.5px; }

/* alerty i znaczki */
.alert { border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; border: 1px solid; }
.alert.info { background: var(--niebieski-tlo); border-color: #c8d9f2; }
.alert.ok { background: var(--zielony-tlo); border-color: #bfe3cc; }
.alert.ostrz { background: var(--pomarancz-tlo); border-color: #f5d6a6; }
.alert.blad { background: var(--czerwony-tlo); border-color: #f0b8b2; color: #7d1a12; }
.alert .przycisk { margin-left: 8px; }
.wzz-alert { background: var(--czerwony-tlo); border: 2px solid var(--czerwony); color: #6e150e; }
.wzz-alert .pole { margin-top: 10px; }
.znaczek { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 11.5px; font-weight: 700; background: #efede7; color: #4c4b44; white-space: nowrap; }
.znaczek.r-PZ, .znaczek.r-BO { background: var(--zielony-tlo); color: var(--zielony); }
.znaczek.r-WZ { background: var(--niebieski-tlo); color: var(--niebieski); }
.znaczek.r-WZZ { background: var(--czerwony); color: #fff; }
.znaczek.r-ZW { background: #f1ecfb; color: #5b3a9a; }
.znaczek.anul { background: #e9e7e1; color: #6b6a63; text-decoration: line-through; }
.znaczek.brak { background: var(--czerwony-tlo); color: var(--czerwony); }
.znaczek.ok { background: var(--zielony-tlo); color: var(--zielony); }
.znaczek.wyd { background: var(--niebieski-tlo); color: var(--niebieski); }
.znaczek.eol { background: var(--pomarancz-tlo); color: var(--pomarancz); }
.znaczek.projekt { background: #fff3c4; color: #6b5200; }
.znaczek.demo { background: var(--akcent); color: var(--ciemny); }

/* tabele */
.tabela-owijka { overflow-x: auto; border: 1px solid var(--linia); border-radius: 10px; background: var(--karta); }
.tabela-owijka.wysokosc { max-height: 420px; overflow-y: auto; }
.tabela { width: 100%; border-collapse: collapse; }
.tabela th { position: sticky; top: 0; background: #faf9f6; text-align: left; font-size: 12px; font-weight: 600; color: var(--szary); padding: 9px 12px; border-bottom: 1px solid var(--linia); white-space: nowrap; z-index: 1; }
.tabela td { padding: 9px 12px; border-bottom: 1px solid #efede8; vertical-align: middle; }
.tabela tr:last-child td { border-bottom: 0; }
.tabela .l { text-align: right; white-space: nowrap; }
.tabela tr[data-a] { cursor: pointer; }
.tabela tbody tr:hover td { background: #fbfaf6; }
.tabela tr.anulowany td { color: #9a988f; text-decoration: line-through; }
.tabela tr.anulowany td .znaczek { text-decoration: none; }
.tabela tr.wzz td { background: #fff6f5; }
.tabela tr.wzz td:first-child { box-shadow: inset 3px 0 0 var(--czerwony); }
.tabela tr.inny-projekt td { color: #7d1a12; }
.tabela tr.ostrz td:first-child { box-shadow: inset 3px 0 0 var(--pomarancz); }
.tabela tr.zamkniete td { color: var(--szary); }
.akcje-wiersza { text-align: right; white-space: nowrap; }
.w-ilosc { width: 90px; text-align: right; }
.pusto { padding: 28px; text-align: center; color: var(--szary); border: 1px dashed var(--linia-mocna); border-radius: 10px; background: rgba(255, 255, 255, .5); }

/* filtry i pola */
.filtry { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.szukaj { position: relative; flex: 1; min-width: 240px; max-width: 520px; }
.szukaj .ik { position: absolute; left: 10px; top: 10px; color: var(--szary); }
.szukaj input { width: 100%; padding-left: 36px; }
input, select, textarea { font: inherit; color: inherit; border: 1px solid var(--linia-mocna); border-radius: 8px; padding: 8px 10px; background: #fff; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--akcent-ciemny); outline: none; box-shadow: 0 0 0 3px rgba(255, 196, 0, .25); }
textarea { resize: vertical; width: 100%; }
input.pin { font-size: 22px; letter-spacing: .4em; text-align: center; width: 180px; }
.przelacznik { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
.przelacznik input { width: 16px; height: 16px; accent-color: var(--ciemny); }
.siatka { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; }
.pole { display: flex; flex-direction: column; gap: 4px; }
.pole > span { font-size: 12px; font-weight: 600; color: var(--szary); }
.pole.szerokie { grid-column: 1 / -1; }
.pole.wiersz { flex-direction: row; align-items: center; gap: 10px; }
.pole.wiersz > span { white-space: nowrap; }
.pole input, .pole select { width: 100%; }
.ilosc { display: flex; gap: 6px; }
.ilosc input { flex: 1; }
.ilosc select { width: auto; }
.pozycja { display: grid; grid-template-columns: 32px 1fr 32px; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--linia); align-items: start; }
.pozycja:first-of-type { padding-top: 0; }
.pozycja-nr { width: 26px; height: 26px; border-radius: 50%; background: #efede7; display: grid; place-items: center; font-weight: 700; font-size: 12px; margin-top: 20px; }
.przyciski-pozycji { margin-top: 12px; }
.stopka-formularza { display: flex; justify-content: flex-end; gap: 10px; padding: 8px 0 40px; }
.zakladki { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1px solid var(--linia); }
.zakladki button { border: 0; background: transparent; font: inherit; font-weight: 600; padding: 8px 12px; cursor: pointer; color: var(--szary); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.zakladki button.aktywna { color: var(--tekst); border-bottom-color: var(--akcent-ciemny); }
dl.opis { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; margin: 0 0 14px; }
dl.opis dt { color: var(--szary); font-size: 12.5px; }
dl.opis dd { margin: 0; }
.os-czasu { margin: 0; padding-left: 18px; }
.os-czasu li { margin-bottom: 6px; }
.problemy { margin: 0; padding-left: 18px; }
.problemy li { margin-bottom: 6px; }
.naglowek-firmy { display: flex; gap: 18px; align-items: center; }
.naglowek-firmy img { height: 30px; }

/* okna */
.tlo-modal { position: fixed; inset: 0; background: rgba(22, 22, 15, .45); display: grid; place-items: center; padding: 20px; z-index: 50; animation: pojaw .12s ease-out; }
.okno { background: var(--karta); border-radius: 14px; width: 100%; max-width: 480px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); }
.okno.szerokie { max-width: 860px; }
.okno-naglowek { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px; }
.okno-naglowek h2 { margin: 0; font-size: 18px; }
.okno-tresc { padding: 8px 20px; overflow-y: auto; }
.okno-stopka { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px 18px; border-top: 1px solid var(--linia); margin-top: 8px; flex-wrap: wrap; }
@keyframes pojaw { from { opacity: 0; } to { opacity: 1; } }
#toasty { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--ciemny); color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); max-width: 420px; transition: opacity .5s, transform .5s; }
.toast.ok { border-left: 4px solid var(--akcent); }
.toast.blad { background: var(--czerwony); }
.toast.znika { opacity: 0; transform: translateY(8px); }

@media (max-width: 900px) {
  .uklad { grid-template-columns: 1fr; height: auto; }
  .boczny { height: auto; }
  .glowna { height: auto; }
  .dwie-kolumny { grid-template-columns: 1fr; }
}

/* ---------------------------------------------------------------- wydruk */
#druk { display: none; }
@page { size: A4; margin: 14mm 12mm; }
@media print {
  body { background: #fff; }
  #app, #modal, #toasty { display: none !important; }
  #druk { display: block; }
  .arkusz { font-size: 10.5pt; color: #000; position: relative; }
  .znak-wodny { position: fixed; top: 40%; left: 0; right: 0; text-align: center; font-size: 80pt; font-weight: 800; color: rgba(200, 40, 28, .18); transform: rotate(-25deg); }
  .d-naglowek { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 12px; }
  .d-logo { height: 13mm; }
  .d-firma { text-align: right; font-size: 8.5pt; line-height: 1.35; }
  .d-tytul { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .d-rodzaj { font-size: 11pt; text-transform: uppercase; letter-spacing: .05em; }
  .d-numer { font-size: 20pt; font-weight: 800; }
  .d-qr { width: 22mm; height: 22mm; }
  .d-qr svg { width: 100%; height: 100%; }
  .d-wzz { border: 3px solid #c8281c; color: #c8281c; padding: 8px 10px; margin-bottom: 10px; font-size: 11pt; }
  .d-meta { border-collapse: collapse; margin-bottom: 12px; width: 100%; }
  .d-meta th { text-align: left; width: 38mm; font-weight: 600; padding: 2px 8px 2px 0; vertical-align: top; color: #333; }
  .d-meta td { padding: 2px 0; }
  .d-pozycje { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .d-pozycje th, .d-pozycje td { border: 1px solid #555; padding: 4px 6px; text-align: left; vertical-align: top; }
  .d-pozycje th { background: #eee; font-size: 9pt; }
  .d-pozycje .l { text-align: right; white-space: nowrap; }
  .d-pozycje tr.d-zast td { color: #c8281c; font-weight: 600; }
  .d-uwagi { margin: 8px 0; }
  .d-podpisy { display: flex; gap: 20mm; margin-top: 22mm; page-break-inside: avoid; }
  .d-podpisy > div { flex: 1; text-align: center; font-size: 9.5pt; }
  .d-linia { border-top: 1px solid #000; margin-bottom: 4px; }
  .d-stopka { margin-top: 14mm; font-size: 7.5pt; color: #555; border-top: 1px solid #ccc; padding-top: 4px; }
}

</style>
</head>

<div id="app"></div>
<div id="modal"></div>

  }

  function przenies(st, ev) {
    const d = ev.dane;
    if (d.do) st.lokalizacje.add(norm(d.do));
    if (d.sn) {
      const e = st.egzemplarze.get(kluczEgz(d.modelId, d.sn));
      if (!e || e.status !== 'magazyn') {
        problem(st, 'SN', 'Przeniesienie: ' + opisModelu(st, d.modelId) + ' SN ' + d.sn + ' nie jest na stanie', ev.id);
        return;
      }
      e.historia.push({ ts: ev.ts, rodzaj: 'PRZENIES', opis: 'Przeniesiono z ' + e.lok + ' na ' + norm(d.do) });
      e.lok = norm(d.do);
    } else {
      const kz = kluczPartii(d.modelId, d.z, d.projekt);
      const jest = st.partie.get(kz) || 0;
      const ile = zaokr(d.ilosc);
      if (jest + 1e-9 < ile) problem(st, 'ILOSC', 'Przeniesienie: brak ' + ile + ' ' + opisModelu(st, d.modelId) + ' w ' + d.z + ', jest ' + jest, ev.id);
      st.partie.set(kz, zaokr(jest - ile));
      const kd = kluczPartii(d.modelId, d.do, d.projekt);
      st.partie.set(kd, zaokr((st.partie.get(kd) || 0) + ile));
    }
  }

  function kontrolaSpojnosci(st) {
    // luki w numeracji dokumentów
    const maks = new Map();
    const sa = new Set();
    for (const { ev } of st.dokumenty.values()) {
      const k = ev.dane.rodzaj + '/' + ev.dane.rok;
      maks.set(k, Math.max(maks.get(k) || 0, ev.dane.nr));
      sa.add(k + '/' + ev.dane.nr);
    }
    for (const [k, m] of maks) {
      for (let i = 1; i < m; i++) {
        if (!sa.has(k + '/' + i)) {
          const [rodzaj, rok] = k.split('/');
          problem(st, 'LUKA', 'Brakuje dokumentu ' + formatNumer(rodzaj, rok, i) + ' (plik usunięty lub jeszcze się synchronizuje)');
        }
      }
    }
    // luki w numeracji zdarzeń użytkownika
    const wgAutora = new Map();
    for (const ev of st.zdarzenia) {
      if (!wgAutora.has(ev.autor)) wgAutora.set(ev.autor, new Set());
      wgAutora.get(ev.autor).add(Number(ev.seq) || 0);
    }
    for (const [autor, zbior] of wgAutora) {
      const m = Math.max(...zbior);
      const brak = [];
      for (let i = 1; i <= m; i++) if (!zbior.has(i)) brak.push(i);
      if (brak.length) {
        const u = st.uzytkownicy.get(autor);
        problem(st, 'LUKA', 'Brakuje ' + brak.length + ' zdarzeń użytkownika ' + (u ? u.imie + ' ' + u.nazwisko : autor) + ' (nr ' + brak.slice(0, 5).join(', ') + (brak.length > 5 ? '…' : '') + ')');
      }
    }
  }

  // ---------------------------------------------------------------- tworzenie zdarzeń

  function noweZdarzenie(st, typ, autor, dane, teraz) {
    const ts = (teraz || new Date()).toISOString();
    return { v: WERSJA, id: noweId(), typ, ts, autor, seq: (st.seqMax.get(autor) || 0) + 1, dane };
  }

  function nastepnyNumer(st, rodzaj, rok) {
    let m = 0;
    for (const { ev } of st.dokumenty.values()) if (ev.dane.rodzaj === rodzaj && ev.dane.rok === rok) m = Math.max(m, ev.dane.nr);
    return m + 1;
  }

  /** Czy wydanie z danej partii/egzemplarza na projekt docelowy jest wydaniem zastępczym. */
  function czyZastepcze(projektZakupu, projektDocelowy) {
    return !!norm(projektZakupu) && normKlucz(projektZakupu) !== normKlucz(projektDocelowy);
  }

  /**
   * Przygotowuje zdarzenie dokumentu z nadanym numerem.
   * dane: {rodzaj, data, projekt, klientId, klientNazwa, adres, dostawca, nrFaktury, osoba, uwagi, powod, pozycje}
   */
  function przygotujDokument(st, autor, dane, teraz) {
    const t = teraz || new Date();
    const rok = Number((dane.data || t.toISOString()).slice(0, 4));
    const rodzaj = dane.rodzaj;
    const nr = nastepnyNumer(st, rodzaj, rok);
    const tresc = Object.assign({}, dane, { rodzaj, rok, nr, numer: formatNumer(rodzaj, rok, nr) });
    return noweZdarzenie(st, 'DOK', autor, tresc, t);
  }

  /** Zwraca listę problemów, które spowodowałoby dodanie zdarzenia (pusta lista = OK). */
  function sprawdzNowe(zdarzenia, ev) {
    const przed = zbudujStan(zdarzenia, { bezKontroli: true });
    const po = zbudujStan(zdarzenia.concat([ev]), { bezKontroli: true });
    const klucz = (p) => p.kod + '|' + p.opis;
    const bylo = new Set(przed.problemy.map(klucz));
    return po.problemy.filter((p) => !bylo.has(klucz(p))).map((p) => p.opis);
  }

  function walidujDokument(st, d) {
    const bledy = [];
    const r = RODZAJE[d.rodzaj];
    if (!r) bledy.push('Nieznany rodzaj dokumentu');
    if (!d.pozycje || !d.pozycje.length) bledy.push('Dokument nie ma żadnej pozycji');
    if (r && r.kierunek === 'wydanie' && !norm(d.projekt)) bledy.push('Podaj numer projektu, na który wydajesz sprzęt');
    if (r && r.kierunek === 'wydanie' && !norm(d.klientNazwa)) bledy.push('Podaj klienta');
    if (r && r.kierunek === 'zwrot' && !norm(d.projekt)) bledy.push('Podaj numer projektu, z którego wraca sprzęt');
    if (d.rodzaj === 'PZ' && !norm(d.dostawca)) bledy.push('Podaj dostawcę');
    if (d.rodzaj === 'WZZ' && !norm(d.powod)) bledy.push('Wydanie zastępcze wymaga powodu');
    (d.pozycje || []).forEach((p, i) => {
      const m = st.modele.get(p.modelId);
      const n = 'Pozycja ' + (i + 1) + ': ';
      if (!m) { bledy.push(n + 'wybierz model'); return; }
      if (m.seryjny && !norm(p.sn)) bledy.push(n + 'podaj numer seryjny');
      if (!m.seryjny && !(Number(p.ilosc) > 0)) bledy.push(n + 'ilość musi być większa od zera');
      if (r && (r.kierunek === 'przyjecie' || r.kierunek === 'zwrot') && !norm(p.lok)) bledy.push(n + 'podaj lokalizację');
    });
    // powtórzone numery seryjne w jednym dokumencie
    const sn = new Set();
    for (const p of d.pozycje || []) {
      if (!p.sn) continue;
      const k = kluczEgz(p.modelId, p.sn);
      if (sn.has(k)) bledy.push('Numer seryjny ' + p.sn + ' występuje w dokumencie dwa razy');
      sn.add(k);
    }
    // wydanie zastępcze musi być oznaczone jako WZZ
    if (r && r.kierunek === 'wydanie') {
      const zast = (d.pozycje || []).some((p) => czyZastepcze(p.projektZakupu, d.projekt));
      if (zast && d.rodzaj !== 'WZZ') bledy.push('Dokument zawiera sprzęt kupiony pod inny projekt – musi to być wydanie zastępcze (WZZ)');
      if (!zast && d.rodzaj === 'WZZ') bledy.push('Wydanie zastępcze bez sprzętu z innego projektu – użyj zwykłego WZ');
    }
    return bledy;
  }

  // ---------------------------------------------------------------- zestawienia

  function stanyModeli(st) {
    const wynik = new Map();
    for (const [id, m] of st.modele) wynik.set(id, { model: m, wolne: 0, podProjekt: 0, projekty: new Map(), wydane: 0 });
    for (const [k, ilosc] of st.partie) {
      if (Math.abs(ilosc) < 1e-9) continue;
      const [modelId, , projekt] = k.split('|');
      const w = wynik.get(modelId);
      if (!w) continue;
      if (projekt) {
        w.podProjekt = zaokr(w.podProjekt + ilosc);
        w.projekty.set(projekt, zaokr((w.projekty.get(projekt) || 0) + ilosc));
      } else w.wolne = zaokr(w.wolne + ilosc);
    }
    for (const e of st.egzemplarze.values()) {
      const w = wynik.get(e.modelId);
      if (!w) continue;
      if (e.status === 'magazyn') {
        if (e.projektZakupu) {
          w.podProjekt += 1;
          w.projekty.set(e.projektZakupu, (w.projekty.get(e.projektZakupu) || 0) + 1);
        } else w.wolne += 1;
      } else if (e.status === 'wydany') w.wydane += 1;
    }
    for (const [k, ilosc] of st.wydane) {
      const modelId = k.split('|').pop();
      const w = wynik.get(modelId);
      if (w) w.wydane = zaokr(w.wydane + ilosc);
    }
    return Array.from(wynik.values()).map((w) => Object.assign(w, {
      razem: zaokr(w.wolne + w.podProjekt),
      ponizejMin: Number(w.model.stanMin) > 0 && w.wolne + w.podProjekt < Number(w.model.stanMin),
    }));
  }

  /** Wiersze: co leży w magazynie, w podziale na lokalizacje (do wydania, przeniesienia, raportów). */
  function wierszeMagazynu(st) {
    const w = [];
    for (const [k, ilosc] of st.partie) {
      if (Math.abs(ilosc) < 1e-9) continue;
      const [modelId, lok, projekt] = k.split('|');
      w.push({ modelId, lok, projekt, ilosc, sn: '' });
    }
    for (const e of st.egzemplarze.values()) {
      if (e.status !== 'magazyn') continue;
      w.push({ modelId: e.modelId, lok: e.lok, projekt: e.projektZakupu, ilosc: 1, sn: e.sn, stanTech: e.stanTech });
    }
    return w;
  }

  /** Co jest wydane na dany projekt (do zwrotów i raportów). */
  function wydaneNaProjekt(st, projekt) {
    const p = normKlucz(projekt);
    const w = [];
    for (const e of st.egzemplarze.values()) {
      if (e.status === 'wydany' && (!p || normKlucz(e.projekt) === p)) w.push({ modelId: e.modelId, sn: e.sn, ilosc: 1, projekt: e.projekt, klient: e.klient, numer: e.wydanie && e.wydanie.numer });
    }
    for (const [k, ilosc] of st.wydane) {
      if (ilosc < 1e-9) continue;
      const i = k.lastIndexOf('|');
      const proj = k.slice(0, i);
      const modelId = k.slice(i + 1);
      if (!p || normKlucz(proj) === p) w.push({ modelId, sn: '', ilosc, projekt: proj, klient: st.wydaneKlient.get(k) || '' });
    }
    return w;
  }

  function dokumentyLista(st) {
    return Array.from(st.dokumenty.values()).sort((a, b) => (a.ev.ts < b.ev.ts ? 1 : -1));
  }

  function podpowiedzi(st) {
    const klienci = new Set();
    for (const k of st.klienci.values()) if (k.nazwa) klienci.add(k.nazwa);
    for (const { ev } of st.dokumenty.values()) if (ev.dane.klientNazwa) klienci.add(ev.dane.klientNazwa);
    const dostawcy = new Set();
    for (const { ev } of st.dokumenty.values()) if (ev.dane.dostawca) dostawcy.add(ev.dane.dostawca);
    const producenci = new Set();
    for (const m of st.modele.values()) if (m.producent) producenci.add(m.producent);
    const sortuj = (s) => Array.from(s).filter(Boolean).sort((a, b) => a.localeCompare(b, 'pl'));
    return { lokalizacje: sortuj(st.lokalizacje), projekty: sortuj(st.projekty), klienci: sortuj(klienci), dostawcy: sortuj(dostawcy), producenci: sortuj(producenci) };
  }

  /** Czy wartość jest nowa (nie występowała) – do potwierdzania nowych lokalizacji/projektów. */
  function czyNowaWartosc(lista, wartosc) {
    const k = normKlucz(wartosc);
    return !!k && !lista.some((x) => normKlucz(x) === k);
  }

  function opisZdarzenia(st, ev) {
    const d = ev.dane || {};
    switch (ev.typ) {
      case 'DOK': return (RODZAJE[d.rodzaj] || {}).nazwa + ' ' + d.numer + (d.projekt ? ' · projekt ' + d.projekt : '') + ' · ' + (d.pozycje || []).length + ' poz.';
      case 'ANUL': return 'Anulowano ' + (d.numer || '') + ' · powód: ' + (d.powod || '');
      case 'PRZENIES': return 'Przeniesiono ' + opisModelu(st, d.modelId) + (d.sn ? ' SN ' + d.sn : ' ' + d.ilosc) + ' z ' + d.z + ' na ' + d.do;
      case 'SKAN': return 'Dołączono skan do ' + (d.numer || '') + ': ' + d.plik;
      case 'UZUP': return 'Oznaczono jako uzupełnione: ' + (d.numer || '') + ' poz. ' + (Number(d.idx) + 1) + (d.uwagi ? ' · ' + d.uwagi : '');
      case 'MODEL': return 'Kartoteka: ' + (d.producent ? d.producent + ' ' : '') + (d.model || opisModelu(st, d.modelId));
      case 'KLIENT': return 'Klient: ' + (d.nazwa || d.klientId);
      case 'UZYTK': return 'Użytkownik: ' + (d.imie || '') + ' ' + (d.nazwisko || '') + (d.aktywny === false ? ' (dezaktywowany)' : '');
      default: return ev.typ;
    }
  }

  return {
    WERSJA, RODZAJE, KATEGORIE, STANY_TECHNICZNE,
    canonical, sha256hex, zapieczetuj, sprawdzPieczec, noweId, zaokr, norm, normKlucz, hashPin,
    formatNumer, nazwaPlikuDokumentu, sciezkaZdarzenia, czyPoprawnaNazwaPliku,
    zbudujStan, noweZdarzenie, nastepnyNumer, przygotujDokument, sprawdzNowe, walidujDokument, czyZastepcze,
    stanyModeli, wierszeMagazynu, wydaneNaProjekt, dokumentyLista, podpowiedzi, czyNowaWartosc, opisZdarzenia, opisModelu,
    kluczEgz,
  };
});

</script>
<script>
/* src/xlsx.js */
/*
 * Minimalny zapis plików .xlsx (jeden arkusz, tekst i liczby, pogrubiony nagłówek).
 * Bez zewnętrznych bibliotek: pliki XML pakowane do ZIP bez kompresji.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.MagazynXlsx = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const TABELA_CRC = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bajty) {
    let c = 0xffffffff;
    for (let i = 0; i < bajty.length; i++) c = TABELA_CRC[(c ^ bajty[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  function zip(pliki) {
    // pliki: [{nazwa, dane: Uint8Array}]
    const enc = new TextEncoder();
    const czesci = [];
    const katalog = [];
    let przesuniecie = 0;
    const dosTime = 0, dosDate = (2026 - 1980) << 9 | 1 << 5 | 1;
    for (const p of pliki) {
      const nazwa = enc.encode(p.nazwa);
      const crc = crc32(p.dane);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true); // UTF-8
      lh.setUint16(8, 0, true); // bez kompresji
      lh.setUint16(10, dosTime, true);
      lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, p.dane.length, true);
      lh.setUint32(22, p.dane.length, true);
      lh.setUint16(26, nazwa.length, true);
      lh.setUint16(28, 0, true);
      czesci.push(new Uint8Array(lh.buffer), nazwa, p.dane);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true);
      ch.setUint16(12, dosTime, true);
      ch.setUint16(14, dosDate, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, p.dane.length, true);
      ch.setUint32(24, p.dane.length, true);
      ch.setUint16(28, nazwa.length, true);
      ch.setUint32(42, przesuniecie, true);
      katalog.push(new Uint8Array(ch.buffer), nazwa);
      przesuniecie += 30 + nazwa.length + p.dane.length;
    }
    const rozmiarKatalogu = katalog.reduce((s, b) => s + b.length, 0);
    const koniec = new DataView(new ArrayBuffer(22));
    koniec.setUint32(0, 0x06054b50, true);
    koniec.setUint16(8, pliki.length, true);
    koniec.setUint16(10, pliki.length, true);
    koniec.setUint32(12, rozmiarKatalogu, true);
    koniec.setUint32(16, przesuniecie, true);
    const wszystko = czesci.concat(katalog, [new Uint8Array(koniec.buffer)]);
    const dl = wszystko.reduce((s, b) => s + b.length, 0);
    const wynik = new Uint8Array(dl);
    let o = 0;
    for (const b of wszystko) { wynik.set(b, o); o += b.length; }
    return wynik;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');
  }

  function kolumna(i) {
    let s = '';
    i += 1;
    while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); }
    return s;
  }

  /**
   * @param {string} arkusz nazwa arkusza
   * @param {string[]} naglowki
   * @param {Array<Array<string|number|null>>} wiersze
   * @param {string} [tytul] opis nad tabelą (np. data eksportu)
   */
  function utworz(arkusz, naglowki, wiersze, tytul) {
    const enc = new TextEncoder();
    const rows = [];
    let r = 1;
    const komorka = (c, v, styl) => {
      const ref = kolumna(c) + r;
      const s = styl ? ' s="' + styl + '"' : '';
      if (v === null || v === undefined || v === '') return '<c r="' + ref + '"' + s + '/>';
      if (typeof v === 'number' && isFinite(v)) return '<c r="' + ref + '"' + s + '><v>' + v + '</v></c>';
      return '<c r="' + ref + '"' + s + ' t="inlineStr"><is><t xml:space="preserve">' + esc(v) + '</t></is></c>';
    };
    if (tytul) {
      rows.push('<row r="' + r + '">' + komorka(0, tytul, 2) + '</row>');
      r += 2;
    }
    const wierszNaglowka = r;
    rows.push('<row r="' + r + '">' + naglowki.map((h, c) => komorka(c, h, 1)).join('') + '</row>');
    r++;
    for (const w of wiersze) {
      rows.push('<row r="' + r + '">' + w.map((v, c) => komorka(c, v, 0)).join('') + '</row>');
      r++;
    }
    const szer = naglowki.map((h, c) => {
      let m = String(h).length;
      for (const w of wiersze) m = Math.max(m, String(w[c] == null ? '' : w[c]).length);
      return Math.min(60, Math.max(8, m + 2));
    });
    const cols = '<cols>' + szer.map((s, c) => '<col min="' + (c + 1) + '" max="' + (c + 1) + '" width="' + s + '" customWidth="1"/>').join('') + '</cols>';
    const ostatnia = kolumna(Math.max(0, naglowki.length - 1)) + Math.max(wierszNaglowka, r - 1);
    const sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="' + wierszNaglowka + '" topLeftCell="A' + (wierszNaglowka + 1) + '" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
      cols + '<sheetData>' + rows.join('') + '</sheetData>' +
      '<autoFilter ref="A' + wierszNaglowka + ':' + ostatnia + '"/>' +
      '</worksheet>';
    const nazwaArkusza = esc(String(arkusz).replace(/[\\/?*[\]:]/g, ' ').slice(0, 31) || 'Arkusz1');
    const pliki = [
      { nazwa: '[Content_Types].xml', tekst: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },

<script>
/* src/storage.js */
/*
 * Magazyn AV – zapis i odczyt plików.
 * FolderStore: wskazany folder (np. zsynchronizowany OneDrive) przez File System Access API (Edge, Chrome).
 * MemoryStore: dane w pamięci (tryb demonstracyjny, testy).
 */
(function (root) {
  'use strict';
  const C = root.MagazynCore;

  function podziel(sciezka) {
    const cz = sciezka.split('/').filter(Boolean);
    return { katalog: cz.slice(0, -1), nazwa: cz[cz.length - 1] };
  }

  async function poKolei(elementy, ile, fn) {
    const wynik = [];
    for (let i = 0; i < elementy.length; i += ile) {
      wynik.push(...(await Promise.all(elementy.slice(i, i + ile).map(fn))));
    }
    return wynik;
  }

  async function przetworzPliki(pliki) {
    // pliki: [{sciezka, tekst}]
    const zdarzenia = [];
    const dziwne = [];
    for (const p of pliki) {
      if (!C.czyPoprawnaNazwaPliku(p.sciezka)) dziwne.push(p.sciezka);
      let ev;
      try {
        ev = JSON.parse(p.tekst);
      } catch (e) {
        zdarzenia.push({ _plik: p.sciezka, _uszkodzony: true });
        continue;
      }
      ev._plik = p.sciezka;
      ev._pieczecOk = await C.sprawdzPieczec(ev);
      zdarzenia.push(ev);
    }
    return { zdarzenia, dziwne };
  }

  class FolderStore {
    constructor(uchwyt) {
      this.uchwyt = uchwyt;
      this.nazwa = uchwyt.name || 'folder';
      this.rodzaj = 'folder';
    }

    async maUprawnienia(zapytaj) {
      if (typeof this.uchwyt.queryPermission !== 'function') return true;
      const opcje = { mode: 'readwrite' };
      if ((await this.uchwyt.queryPermission(opcje)) === 'granted') return true;
      if (!zapytaj) return false;
      return (await this.uchwyt.requestPermission(opcje)) === 'granted';
    }

    async _katalog(czesci, utworz) {
      let d = this.uchwyt;
      for (const c of czesci) d = await d.getDirectoryHandle(c, { create: !!utworz });
      return d;
    }

    async _przejdz(katalog, prefiks, wynik) {
      for await (const [nazwa, h] of katalog.entries()) {
        if (h.kind === 'directory') await this._przejdz(h, prefiks + nazwa + '/', wynik);
        else if (nazwa.toLowerCase().endsWith('.json')) wynik.push({ sciezka: prefiks + nazwa, h });
      }
    }

    async wczytajWszystko() {
      const lista = [];
      for (const gl of ['dokumenty', 'zdarzenia']) {
        let k;
        try {
          k = await this.uchwyt.getDirectoryHandle(gl);
        } catch (e) {
          continue;
        }
        await this._przejdz(k, gl + '/', lista);
      }
      const pliki = await poKolei(lista, 40, async (p) => ({ sciezka: p.sciezka, tekst: await (await p.h.getFile()).text() }));
      return przetworzPliki(pliki);
    }

    async istnieje(sciezka) {
      const { katalog, nazwa } = podziel(sciezka);
      try {
        const d = await this._katalog(katalog, false);
        await d.getFileHandle(nazwa);
        return true;
      } catch (e) {
        return false;
      }
    }

    async zapisz(sciezka, tresc, opcje = {}) {
      const { katalog, nazwa } = podziel(sciezka);
      const d = await this._katalog(katalog, true);
      if (opcje.nieNadpisuj) {
        let jest = false;
        try {
          await d.getFileHandle(nazwa);
          jest = true;
        } catch (e) { /* brak pliku – dobrze */ }
        if (jest) {
          const err = new Error('Plik już istnieje: ' + sciezka);
          err.kod = 'ISTNIEJE';
          throw err;
        }
      }
      const fh = await d.getFileHandle(nazwa, { create: true });
      const w = await fh.createWritable();
      await w.write(tresc);
      await w.close();
    }

    async czytaj(sciezka) {
      const { katalog, nazwa } = podziel(sciezka);
      const d = await this._katalog(katalog, false);
      return (await d.getFileHandle(nazwa)).getFile();
    }

    async lista(sciezka) {
      try {
        const d = await this._katalog(sciezka.split('/').filter(Boolean), false);
        const nazwy = [];
        for await (const [n] of d.entries()) nazwy.push(n);
        return nazwy;
      } catch (e) {
        return [];
      }
    }
  }

  class MemoryStore {
    constructor(nazwa) {
      this.pliki = new Map();
      this.nazwa = nazwa || 'pamięć';
      this.rodzaj = 'pamiec';
    }
    async maUprawnienia() { return true; }
    async wczytajWszystko() {
      const pliki = [];
      for (const [sciezka, tresc] of this.pliki) {
        if ((sciezka.startsWith('dokumenty/') || sciezka.startsWith('zdarzenia/')) && sciezka.endsWith('.json')) pliki.push({ sciezka, tekst: tresc });
      }
      return przetworzPliki(pliki);
    }
    async istnieje(sciezka) { return this.pliki.has(sciezka); }
    async zapisz(sciezka, tresc, opcje = {}) {
      if (opcje.nieNadpisuj && this.pliki.has(sciezka)) {
        const err = new Error('Plik już istnieje: ' + sciezka);
        err.kod = 'ISTNIEJE';
        throw err;
      }
      this.pliki.set(sciezka, tresc);
    }
    async czytaj(sciezka) {
      const t = this.pliki.get(sciezka);
      if (t === undefined) throw new Error('Brak pliku ' + sciezka);
      return t instanceof Blob ? t : new Blob([t]);
    }
    async lista(sciezka) {
      const pref = sciezka.replace(/\/?$/, '/');
      const nazwy = new Set();
      for (const k of this.pliki.keys()) if (k.startsWith(pref)) nazwy.add(k.slice(pref.length).split('/')[0]);
      return Array.from(nazwy);
    }
  }

  // ------------------------------------------------ zapamiętanie folderu (IndexedDB)

  function idb() {
    return new Promise((ok, zle) => {
      const r = indexedDB.open('magazyn-av', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('ustawienia');
      r.onsuccess = () => ok(r.result);
      r.onerror = () => zle(r.error);
    });
  }

  async function zapamietaj(klucz, wartosc) {
    try {
      const db = await idb();
      await new Promise((ok, zle) => {
        const tx = db.transaction('ustawienia', 'readwrite');
        tx.objectStore('ustawienia').put(wartosc, klucz);
        tx.oncomplete = ok;
        tx.onerror = () => zle(tx.error);
      });
    } catch (e) { /* brak IndexedDB – trudno */ }
  }

  async function przypomnij(klucz) {
    try {
      const db = await idb();
      return await new Promise((ok, zle) => {
        const tx = db.transaction('ustawienia', 'readonly');
        const r = tx.objectStore('ustawienia').get(klucz);
        r.onsuccess = () => ok(r.result);
        r.onerror = () => zle(r.error);
      });
    } catch (e) {
      return undefined;
    }
  }

  root.MagazynStorage = { FolderStore, MemoryStore, zapamietaj, przypomnij };
})(typeof self !== 'undefined' ? self : this);

</script>

  const FIRMA = {
    nazwa: 'MAASCK SPÓŁKA Z OGRANICZONĄ ODPOWIEDZIALNOŚCIĄ',
    adres: 'Piękna 24/26A, 00-549 Warszawa',
    nip: '7011115199',

  };
  const LOGO = window.MAGAZYN_LOGO || '';

  const app = {
    store: null,
    demo: false,
    zdarzenia: [],
    dziwne: [],
    st: C.zbudujStan([]),
    user: null,
    widok: 'pulpit',
    param: {},
    szkic: null,
    filtr: {},
    ostatniOdczyt: null,
    zapamietanyFolder: null,
    zajety: false,
  };

  // ------------------------------------------------------------ narzędzia

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (sel, el) => (el || document).querySelector(sel);
  const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
  const dzis = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };
  const fmtData = (iso) => {
    if (!iso) return '';
    const s = String(iso);
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4);
    const d = new Date(s);
    return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
  };
  const fmtCzas = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    return fmtData(iso) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  };
  const fmtL = (x) => (Number(x) || 0).toLocaleString('pl-PL', { maximumFractionDigits: 3 });
  const model = (id) => app.st.modele.get(id) || { modelId: id, model: '(nieznany model)', producent: '', jednostka: 'szt' };

  const jedn = (id) => model(id).jednostka || 'szt';
  const fmtIl = (id, x) => {
    const m = model(id);
    let s = fmtL(x) + ' ' + (m.jednostka || 'szt');
    if (m.jednostkaZakupu && Number(m.przelicznik) > 0 && Math.abs(x) >= Number(m.przelicznik)) s += ' <span class="szary">(≈ ' + fmtL(Math.round((x / m.przelicznik) * 10) / 10) + ' × ' + esc(m.jednostkaZakupu) + ')</span>';

  const bezPodkreslnikow = (ev) => {

    for (const [a, b] of Object.entries(ev)) if (!a.startsWith('_')) k[a] = b;

  async function wczytaj() {
    const { zdarzenia, dziwne } = await app.store.wczytajWszystko();

    przelicz();

  function przelicz() {
    app.st = C.zbudujStan(app.zdarzenia);
    for (const p of app.dziwne) app.st.problemy.push({ kod: 'PLIK', opis: 'Nietypowa nazwa pliku – możliwa kopia konfliktowa OneDrive: ' + p });
    if (app.user && app.st.uzytkownicy.has(app.user.userId)) app.user = app.st.uzytkownicy.get(app.user.userId);
  }

  async function zapiszZdarzenie(ev) {
    await C.zapieczetuj(ev);
    const sciezka = C.sciezkaZdarzenia(ev);
    await app.store.zapisz(sciezka, JSON.stringify(bezPodkreslnikow(ev), null, 2), { nieNadpisuj: true });
    ev._plik = sciezka;
    ev._pieczecOk = true;
    app.zdarzenia.push(ev);
    przelicz();
    return ev;
  }

  async function utworzZdarzenie(typ, dane) {
    const ev = C.noweZdarzenie(app.st, typ, app.user.userId, dane);
    const problemy = typ === 'MODEL' || typ === 'KLIENT' || typ === 'UZYTK' ? [] : C.sprawdzNowe(app.zdarzenia, ev);
    if (problemy.length) throw new BladUzytkownika(problemy);
    return zapiszZdarzenie(ev);
  }

  async function zapiszDokument(dane) {
    await wczytaj(); // świeży odczyt folderu tuż przed zapisem
    const bledy = C.walidujDokument(app.st, dane);
    if (bledy.length) throw new BladUzytkownika(bledy);
    for (let proba = 0; proba < 6; proba++) {
      const ev = C.przygotujDokument(app.st, app.user.userId, dane);
      const problemy = C.sprawdzNowe(app.zdarzenia, ev);
      if (problemy.length) throw new BladUzytkownika(problemy);
      try {
        return await zapiszZdarzenie(ev);
      } catch (e) {
        if (e.kod === 'ISTNIEJE') {
          await wczytaj();
          continue;
        }
        throw e;
      }
    }
    throw new Error('Nie udało się nadać numeru dokumentu. Odśwież i spróbuj ponownie.');
  }

  async function kopiaTygodniowa(wymus) {
    if (!app.store || app.store.rodzaj !== 'folder' || !app.user) return;
    const nazwy = await app.store.lista('kopie');
    const daty = nazwy.map((n) => (n.match(/^kopia-(\d{4}-\d{2}-\d{2})\.json$/) || [])[1]).filter(Boolean).sort();
    const ostatnia = daty[daty.length - 1];
    const dni = ostatnia ? (Date.now() - Date.parse(ostatnia)) / 86400000 : Infinity;
    if (!wymus && dni < 7) return;
    const tresc = { utworzono: new Date().toISOString(), przez: osoba(app.user.userId), liczbaZdarzen: app.zdarzenia.length, zdarzenia: app.zdarzenia.filter((e) => e.id).map(bezPodkreslnikow) };
    await app.store.zapisz('kopie/kopia-' + dzis() + '.json', JSON.stringify(tresc));
    toast('Zapisano kopię zapasową: kopie/kopia-' + dzis() + '.json', 'ok');
  }

  let otwartyDialog = null;

  function dialog({ tytul, tresc, przyciski, szeroki, przyOtwarciu, przyWyslaniu }) {
    return new Promise((ok) => {
      const m = $('#modal');
      m.innerHTML = '<div class="tlo-modal"><form class="okno ' + (szeroki ? 'szerokie' : '') + '" novalidate>' +
        '<div class="okno-naglowek"><h2>' + tytul + '</h2><button type="button" class="ikonowy" data-dialog="__anuluj" aria-label="Zamknij">' + ikona('x') + '</button></div>' +
        '<div class="okno-tresc">' + tresc + '<div class="bledy-okna"></div></div>' +
        '<div class="okno-stopka">' + (przyciski || [{ wartosc: 'ok', etykieta: 'OK', klasa: 'glowny' }]).map((p) =>
          '<button type="' + (p.submit ? 'submit' : 'button') + '" class="przycisk ' + (p.klasa || '') + '" data-dialog="' + esc(p.wartosc) + '">' + p.etykieta + '</button>').join('') + '</div>' +
        '</form></div>';
      const form = $('form', m);
      const zamknij = (w) => {
        m.innerHTML = '';
        otwartyDialog = null;
        ok(w);
      };
      otwartyDialog = { zamknij };
      const obsluz = async (wartosc) => {
        if (wartosc === '__anuluj' || wartosc === 'anuluj') return zamknij(null);
        if (przyWyslaniu) {
          try {
            const w = await przyWyslaniu(form, wartosc);
            if (w === false) return;
            zamknij(w === undefined ? wartosc : w);
          } catch (e) {
            $('.bledy-okna', form).innerHTML = '<div class="alert blad">' + (e.lista ? e.lista.map(esc).join('<br>') : esc(e.message)) + '</div>';
          }
        } else zamknij(wartosc);
      };
      form.addEventListener('click', (e) => {
        const b = e.target.closest('[data-dialog]');
        if (b && b.type !== 'submit') {
          e.preventDefault();
          obsluz(b.dataset.dialog);
        }
      });
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const b = e.submitter && e.submitter.dataset.dialog;
        obsluz(b || (przyciski || []).find((p) => p.submit)?.wartosc || 'ok');
      });
      if (przyOtwarciu) przyOtwarciu(form);
      const pierwszy = $('input:not([type=hidden]):not([readonly]), select, textarea', form);
      if (pierwszy) setTimeout(() => pierwszy.focus(), 30);
    });
  }

  const potwierdz = (tytul, tresc, etykieta, klasa) => dialog({ tytul, tresc: '<p>' + tresc + '</p>', przyciski: [{ wartosc: 'anuluj', etykieta: 'Wróć' }, { wartosc: 'tak', etykieta: etykieta || 'Tak', klasa: klasa || 'glowny', submit: true }] }).then((w) => w === 'tak');

    const u = app.st.uzytkownicy.get(app.user.userId);
    const w = await dialog({

      tresc: '<p>' + esc(cel) + '</p><p class="szary">Potwierdzasz jako <b>' + esc(u.imie + ' ' + u.nazwisko) + '</b>.</p>' +
        '<label class="pole"><span>PIN</span><input name="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" class="pin"></label>',
      przyciski: [{ wartosc: 'anuluj', etykieta: 'Wróć' }, { wartosc: 'ok', etykieta: 'Potwierdź', klasa: 'glowny', submit: true }],
      przyWyslaniu: async (f) => {
        const pin = f.pin.value.trim();

        if ((await C.hashPin(u.pinSalt, pin)) !== u.pinHash) {
          f.pin.value = '';

    });

  // ------------------------------------------------------------ eksport do Excela

  function pobierz(nazwa, dane, typ) {
    const blob = dane instanceof Blob ? dane : new Blob([dane], { type: typ || 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nazwa;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 1000);
  }

  async function eksport(nazwa, naglowki, wiersze) {
    const teraz = new Date();
    const tytul = 'MAASCK · ' + nazwa + ' · stan na ' + fmtCzas(teraz.toISOString()) + ' · eksport: ' + osoba(app.user.userId);
    const bajty = X.utworz(nazwa, naglowki, wiersze, tytul);
    const plik = nazwa.replace(/[^\p{L}\p{N}]+/gu, '_') + '_' + dzis() + '.xlsx';
    pobierz(plik, bajty, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    if (app.store.rodzaj === 'folder') {
      try {
        await app.store.zapisz('eksporty/' + plik, new Blob([bajty]));
      } catch (e) { /* zapis kopii eksportu nie jest konieczny */ }
    }
    toast('Wyeksportowano: ' + plik, 'ok');
  }

    const bezBo = !docs.some((d) => d.ev.dane.rodzaj === 'BO');
    const kafel = (wartosc, opis, widok, klasa) => '<button class="kafel ' + (klasa || '') + '" data-a="idz" data-w="' + widok + '"><b>' + wartosc + '</b><span>' + opis + '</span></button>';
    return naglowekWidoku('Dzień dobry, ' + esc(app.user.imie), 'Stan na ' + fmtCzas(new Date().toISOString())) +
      (bezBo ? '<div class="alert info"><b>Start od zera.</b> Wprowadź stan początkowy podczas inwentaryzacji dokumentem <b>Bilans otwarcia (BO)</b>. <button class="przycisk glowny" data-a="nowyDok" data-r="BO">' + ikona('bo') + 'Rozpocznij bilans otwarcia</button></div>' : '') +
      '<div class="kafle">' +
        kafel(app.st.modele.size, 'modeli w kartotece', 'kartoteka') +
        kafel(fmtL(naStanie), 'urządzeń na stanie', 'urzadzenia') +
        kafel(wydaniaMiesiac, 'wydań w tym miesiącu', 'dokumenty') +
        kafel(otwarte.length, 'do uzupełnienia po WZZ', 'uzupelnienia', otwarte.length ? 'czerwony' : '') +
        kafel(bezSkanu.length, 'dokumentów bez podpisu', 'raporty', bezSkanu.length ? 'pomaranczowy' : '') +
        kafel(ponizej.length, 'pozycji poniżej minimum', 'raporty', ponizej.length ? 'pomaranczowy' : '') +
        (app.st.problemy.length ? kafel(app.st.problemy.length, 'uwag kontroli spójności', 'problemy', 'pomaranczowy') : '') +
      '</div>' +
      '<div class="dwie-kolumny"><section class="karta"><h2>Ostatnie dokumenty</h2>' + listaDokumentow(docs.slice(0, 8), 'pulpitDok', true) + '</section>' +
      '<section class="karta"><h2>Szybkie akcje</h2><div class="szybkie-duze">' +
        '<button class="akcja-duza" data-a="nowyDok" data-r="PZ">' + ikona('przyj') + '<b>Przyjęcie (PZ)</b><span>Dostawa od dostawcy, także pod projekt</span></button>' +
        '<button class="akcja-duza" data-a="nowyDok" data-r="WZ">' + ikona('wyd') + '<b>Wydanie (WZ / WZZ)</b><span>Sprzęt jedzie do klienta na projekt</span></button>' +
        '<button class="akcja-duza" data-a="nowyDok" data-r="ZW">' + ikona('zwrot') + '<b>Zwrot (ZW)</b><span>Nadwyżki i niewykorzystany sprzęt z budowy</span></button>' +
        '<button class="akcja-duza" data-a="nowyDok" data-r="BO">' + ikona('bo') + '<b>Bilans otwarcia (BO)</b><span>Inwentaryzacja startowa</span></button>' +
      '</div></section></div>';
  };

  function znacznikDok(d) {
    const r = d.ev.dane.rodzaj;
    let s = '<span class="znaczek r-' + r + '">' + r + '</span>';
    if (d.anulowany) s += ' <span class="znaczek anul">anulowany</span>';
    else if (!d.skany.length) s += ' <span class="znaczek brak">brak podpisu</span>';
    return s;
  }

  function listaDokumentow(docs, id, kompakt) {
    const wiersze = docs.map((d) => {
      const x = d.ev.dane;
      const komorki = ['<b class="nowrap">' + esc(x.numer) + '</b>', znacznikDok(d), '<span class="nowrap">' + fmtData(x.data || d.ev.ts) + '</span>', '<span class="nowrap">' + esc(x.projekt || '') + '</span>', esc(x.klientNazwa || x.dostawca || '')];
      const dane = [x.numer, C.RODZAJE[x.rodzaj].nazwa + (d.anulowany ? ' (anulowany)' : ''), fmtData(x.data || d.ev.ts), x.projekt || '', x.klientNazwa || x.dostawca || ''];
      if (!kompakt) {
        komorki.push((x.pozycje || []).length, esc(osoba(d.ev.autor)));
        dane.push((x.pozycje || []).length, osoba(d.ev.autor));
      }
      return { klasa: (d.anulowany ? 'anulowany ' : '') + (x.rodzaj === 'WZZ' ? 'wzz' : ''), akcja: 'pokazDok" data-id="' + d.ev.id, komorki, dane };
    });
    const nagl = ['Numer', 'Rodzaj', 'Data', 'Projekt', 'Klient / dostawca'].concat(kompakt ? [] : ['Pozycje', 'Wystawił']);
    return tabela(id, 'Dokumenty', nagl, wiersze, { pusto: 'Nie ma jeszcze dokumentów', liczbowe: kompakt ? [] : [5] });
  }

  function poleSzukaj(klucz, placeholder) {
    return '<label class="szukaj">' + ikona('szuk') + '<input type="search" placeholder="' + esc(placeholder || 'Szukaj…') + '" value="' + esc(app.filtr[klucz] || '') + '" data-filtr="' + klucz + '"></label>';
  }
  const pasuje = (klucz, ...teksty) => {
    const f = C.normKlucz(app.filtr[klucz] || '');
    if (!f) return true;
    const t = C.normKlucz(teksty.join(' '));
    return f.split(' ').every((cz) => t.includes(cz));
  };

  WIDOKI.stan = () => {
    const kat = app.filtr.stanKat || '';
    const tylkoMin = !!app.filtr.stanMin;
    const stany = C.stanyModeli(app.st)
      .filter((w) => (!kat || w.model.kategoria === kat) && (!tylkoMin || w.ponizejMin) && pasuje('stan', w.model.producent, w.model.model, w.model.pn, w.model.kategoria))
      .sort((a, b) => (a.model.kategoria + a.model.producent + a.model.model).localeCompare(b.model.kategoria + b.model.producent + b.model.model, 'pl'));
    const wiersze = stany.map((w) => {
      const m = w.model;
      return {
        klasa: w.ponizejMin ? 'ostrz' : '',
        akcja: 'pokazModel" data-id="' + m.modelId,
        komorki: [esc(m.kategoria || ''), '<b>' + esc((m.producent ? m.producent + ' ' : '') + m.model) + '</b>' + (m.status === 'EOL' ? ' <span class="znaczek eol">EOL</span>' : m.status === 'wycofany' ? ' <span class="znaczek anul">wycofany</span>' : ''), esc(m.pn || ''), fmtIl(m.modelId, w.wolne), w.podProjekt ? fmtIl(m.modelId, w.podProjekt) : '<span class="szary">–</span>', '<b>' + fmtIl(m.modelId, w.razem) + '</b>', w.wydane ? fmtIl(m.modelId, w.wydane) : '<span class="szary">–</span>', m.stanMin ? fmtL(m.stanMin) : ''],
        dane: [m.kategoria || '', (m.producent ? m.producent + ' ' : '') + m.model, m.pn || '', w.wolne, w.podProjekt, w.razem, w.wydane, Number(m.stanMin) || null, m.jednostka || 'szt', m.status || 'aktywny'],
      };
    });
    tabele.stan = { nazwa: 'Stan magazynu', naglowki: ['Kategoria', 'Model', 'Kod producenta', 'Wolne', 'Pod projekty', 'Razem w magazynie', 'Wydane do klientów', 'Stan minimalny', 'Jednostka', 'Status'], wiersze: wiersze.map((w) => w.dane) };
    return naglowekWidoku('Stan magazynu', 'Wolne + kupione pod projekty = razem w magazynie. Kliknij wiersz, aby zobaczyć szczegóły.', przyciskEksportu('stan')) +
      '<div class="filtry">' + poleSzukaj('stan', 'Szukaj modelu, producenta, kodu…') +
        '<select data-filtr="stanKat"><option value="">Wszystkie kategorie</option>' + C.KATEGORIE.map((k) => '<option ' + (k === kat ? 'selected' : '') + '>' + esc(k) + '</option>').join('') + '</select>' +
        '<label class="przelacznik"><input type="checkbox" data-filtr="stanMin" ' + (tylkoMin ? 'checked' : '') + '> tylko poniżej minimum</label>' +
      '</div>' +
      (wiersze.length ? '<div class="tabela-owijka"><table class="tabela"><thead><tr><th>Kategoria</th><th>Model</th><th>Kod producenta</th><th class="l">Wolne</th><th class="l">Pod projekty</th><th class="l">Razem</th><th class="l">U klientów</th><th class="l">Min.</th></tr></thead><tbody>' +
        wiersze.map((w) => '<tr class="' + w.klasa + '" data-a="' + w.akcja + '" tabindex="0">' + w.komorki.map((k, i) => '<td class="' + (i >= 3 ? 'l' : '') + '">' + k + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>'
        : '<div class="pusto">' + (app.st.modele.size ? 'Nic nie pasuje do filtra' : 'Kartoteka jest pusta. Dodaj modele w kartotece albo od razu w dokumencie przyjęcia.') + '</div>');
  };

  WIDOKI.lokalizacje = () => {
    const wiersze = C.wierszeMagazynu(app.st)
      .filter((w) => pasuje('lok', w.lok, nazwaModelu(w.modelId), w.sn, w.projekt, model(w.modelId).pn))
      .sort((a, b) => (a.lok + nazwaModelu(a.modelId) + a.sn).localeCompare(b.lok + nazwaModelu(b.modelId) + b.sn, 'pl'));
    const html = tabela('lokalizacje', 'Lokalizacje', ['Lokalizacja', 'Model', 'Nr seryjny', 'Ilość', 'Pod projekt', 'Stan techniczny'], wiersze.map((w) => ({
      komorki: ['<b>' + esc(w.lok) + '</b>', esc(nazwaModelu(w.modelId)), esc(w.sn || ''), fmtIl(w.modelId, w.ilosc), w.projekt ? '<span class="znaczek projekt">' + esc(w.projekt) + '</span>' : '', esc(w.stanTech || '')],
      dane: [w.lok, nazwaModelu(w.modelId), w.sn || '', w.ilosc, w.projekt || '', w.stanTech || ''],
      akcjeHtml: '<button class="przycisk maly" data-a="przenies" data-m="' + esc(w.modelId) + '" data-sn="' + esc(w.sn) + '" data-lok="' + esc(w.lok) + '" data-p="' + esc(w.projekt) + '" data-il="' + w.ilosc + '">Przenieś</button>',
    })), { akcje: true, liczbowe: [3], pusto: 'Magazyn jest pusty' });
    return naglowekWidoku('Lokalizacje', 'Co leży w którym miejscu. „Przenieś” zmienia półkę bez formularza – zmiana trafia do dziennika.', przyciskEksportu('lokalizacje')) +
      '<div class="filtry">' + poleSzukaj('lok', 'Szukaj lokalizacji, modelu, numeru seryjnego, projektu…') + '</div>' + html;
  };

  WIDOKI.urzadzenia = () => {
    const status = app.filtr.urzStatus || '';
    const lista = Array.from(app.st.egzemplarze.values())
      .filter((e) => (!status || e.status === status) && pasuje('urz', e.sn, nazwaModelu(e.modelId), e.lok, e.projekt, e.klient, e.projektZakupu, model(e.modelId).pn))
      .sort((a, b) => (nazwaModelu(a.modelId) + a.sn).localeCompare(nazwaModelu(b.modelId) + b.sn, 'pl'));
    const html = tabela('urzadzenia', 'Urządzenia', ['Model', 'Nr seryjny', 'Status', 'Gdzie', 'Pod projekt', 'Stan techniczny', 'Przyjęto'], lista.map((e) => ({
      akcja: 'historia" data-m="' + esc(e.modelId) + '" data-sn="' + esc(e.sn),
      komorki: [esc(nazwaModelu(e.modelId)), '<b class="mono">' + esc(e.sn) + '</b>', e.status === 'magazyn' ? '<span class="znaczek ok">w magazynie</span>' : '<span class="znaczek wyd">u klienta</span>', e.status === 'magazyn' ? esc(e.lok) : esc(e.projekt + (e.klient ? ' · ' + e.klient : '')), e.projektZakupu ? '<span class="znaczek projekt">' + esc(e.projektZakupu) + '</span>' : '', esc(e.stanTech || ''), esc(e.przyjeto ? e.przyjeto.numer : '')],
      dane: [nazwaModelu(e.modelId), e.sn, e.status === 'magazyn' ? 'w magazynie' : 'u klienta', e.status === 'magazyn' ? e.lok : e.projekt + (e.klient ? ' · ' + e.klient : ''), e.projektZakupu || '', e.stanTech || '', e.przyjeto ? e.przyjeto.numer : ''],
    })), { pusto: 'Brak urządzeń z numerami seryjnymi' });
    return naglowekWidoku('Urządzenia', 'Każde urządzenie śledzone po numerze seryjnym. Kliknij, aby zobaczyć historię.', przyciskEksportu('urzadzenia')) +
      '<div class="filtry">' + poleSzukaj('urz', 'Szukaj numeru seryjnego, modelu, projektu, klienta…') +
      '<select data-filtr="urzStatus"><option value="">Wszystkie</option><option value="magazyn" ' + (status === 'magazyn' ? 'selected' : '') + '>W magazynie</option><option value="wydany" ' + (status === 'wydany' ? 'selected' : '') + '>U klienta</option></select></div>' + html;
  };

  WIDOKI.dokumenty = () => {
    const rodzaj = app.filtr.dokRodzaj || '';
    const docs = C.dokumentyLista(app.st).filter((d) => {
      const x = d.ev.dane;
      if (rodzaj === 'bezpodpisu') { if (d.anulowany || d.skany.length) return false; }
      else if (rodzaj && x.rodzaj !== rodzaj) return false;
      return pasuje('dok', x.numer, x.projekt, x.klientNazwa, x.dostawca, x.nrFaktury, x.osoba, x.uwagi, (x.pozycje || []).map((p) => nazwaModelu(p.modelId) + ' ' + (p.sn || '')).join(' '));
    });
    return naglowekWidoku('Dokumenty', 'Kliknij dokument, aby go wydrukować, dołączyć skan podpisu albo anulować.', przyciskEksportu('dokumenty')) +
      '<div class="filtry">' + poleSzukaj('dok', 'Szukaj numeru, projektu, klienta, numeru seryjnego…') +
      '<select data-filtr="dokRodzaj"><option value="">Wszystkie rodzaje</option>' + Object.entries(C.RODZAJE).map(([k, v]) => '<option value="' + k + '" ' + (rodzaj === k ? 'selected' : '') + '>' + k + ' – ' + v.nazwa + '</option>').join('') + '<option value="bezpodpisu" ' + (rodzaj === 'bezpodpisu' ? 'selected' : '') + '>Bez dołączonego podpisu</option></select></div>' +
      listaDokumentow(docs, 'dokumenty');
  };

  WIDOKI.uzupelnienia = () => {
    const pokazZamkniete = !!app.filtr.uzupWszystkie;
    const lista = app.st.uzupelnienia.filter((u) => pokazZamkniete || !u.zamkniete).slice().reverse();
    const html = tabela('uzupelnienia', 'Do uzupełnienia', ['Projekt zakupu (brakuje)', 'Model', 'Nr seryjny / ilość', 'Wydano na projekt', 'Dokument', 'Data', 'Powód', 'Status'], lista.map((u) => ({
      klasa: u.zamkniete ? 'zamkniete' : 'wzz',
      komorki: ['<b>' + esc(u.projektZakupu) + '</b>', esc(nazwaModelu(u.modelId)), u.sn ? '<span class="mono">' + esc(u.sn) + '</span>' : fmtIl(u.modelId, u.ilosc), esc(u.projektDocelowy), '<a href="#" data-a="pokazDok" data-id="' + esc(u.docId) + '">' + esc(u.numer) + '</a>', fmtData(u.ts), esc(u.powod), u.zamkniete ? '<span class="znaczek ok">uzupełnione</span><div class="maly szary">' + esc(u.zamknieto.uwagi || '') + '</div>' : '<span class="znaczek brak">do uzupełnienia</span>'],
      dane: [u.projektZakupu, nazwaModelu(u.modelId), u.sn || u.ilosc + ' ' + jedn(u.modelId), u.projektDocelowy, u.numer, fmtData(u.ts), u.powod, u.zamkniete ? 'uzupełnione: ' + (u.zamknieto.uwagi || '') : 'do uzupełnienia'],
      akcjeHtml: u.zamkniete ? '' : '<button class="przycisk maly" data-a="uzupelnij" data-id="' + esc(u.docId) + '" data-idx="' + u.idx + '">Uzupełnione…</button>',
    })), { akcje: true, pusto: pokazZamkniete ? 'Brak wydań zastępczych' : 'Nic nie czeka na uzupełnienie' });
    return naglowekWidoku('Do uzupełnienia', 'Sprzęt kupiony pod projekt, który poszedł wydaniem zastępczym (WZZ) na inny projekt. Trzeba go dokupić pod projekt zakupu.', przyciskEksportu('uzupelnienia')) +
      '<div class="filtry"><label class="przelacznik"><input type="checkbox" data-filtr="uzupWszystkie" ' + (pokazZamkniete ? 'checked' : '') + '> pokaż także uzupełnione</label></div>' + html;
  };

  WIDOKI.raporty = () => {
    const rap = app.filtr.raport || 'projekt';
    const zakladki = [['projekt', 'Wydane na projekt'], ['klient', 'Wydane do klienta'], ['podprojekt', 'Pod projekt w magazynie'], ['minimum', 'Poniżej minimum'], ['eol', 'EOL na stanie'], ['podpis', 'Bez podpisu'], ['historia', 'Historia urządzenia']];
    let tresc = '';
    const pod = C.podpowiedzi(app.st);
    if (rap === 'projekt' || rap === 'klient') {
      const wartosc = app.filtr['rap_' + rap] || '';
      const lista = rap === 'projekt' ? pod.projekty : pod.klienci;
      let w = C.wydaneNaProjekt(app.st, rap === 'projekt' ? wartosc : '');
      if (rap === 'klient') w = w.filter((x) => !wartosc || C.normKlucz(x.klient) === C.normKlucz(wartosc));
      tresc = '<div class="filtry"><label class="pole wiersz"><span>' + (rap === 'projekt' ? 'Numer projektu' : 'Klient') + '</span><input list="dl-rap" value="' + esc(wartosc) + '" data-filtr="rap_' + rap + '" data-natychmiast="1" placeholder="wszystkie"></label><datalist id="dl-rap">' + lista.map((x) => '<option value="' + esc(x) + '">').join('') + '</datalist></div>' +
        tabela('raport', rap === 'projekt' ? 'Wydane na projekt ' + (wartosc || '(wszystkie)') : 'Wydane do klienta ' + (wartosc || '(wszyscy)'), ['Projekt', 'Klient', 'Model', 'Nr seryjny', 'Ilość', 'Dokument'], w.sort((a, b) => (a.projekt + nazwaModelu(a.modelId)).localeCompare(b.projekt + nazwaModelu(b.modelId), 'pl')).map((x) => ({
          komorki: [esc(x.projekt), esc(x.klient), esc(nazwaModelu(x.modelId)), '<span class="mono">' + esc(x.sn) + '</span>', fmtIl(x.modelId, x.ilosc), esc(x.numer || '')],
          dane: [x.projekt, x.klient, nazwaModelu(x.modelId), x.sn, x.ilosc, x.numer || ''],
        })), { liczbowe: [4], pusto: 'Nic nie zostało wydane' });
    } else if (rap === 'podprojekt') {
      const w = C.wierszeMagazynu(app.st).filter((x) => x.projekt).sort((a, b) => (a.projekt + nazwaModelu(a.modelId)).localeCompare(b.projekt + nazwaModelu(b.modelId), 'pl'));
      tresc = tabela('raport', 'Kupione pod projekt – w magazynie', ['Projekt', 'Model', 'Nr seryjny', 'Ilość', 'Lokalizacja'], w.map((x) => ({
        komorki: ['<b>' + esc(x.projekt) + '</b>', esc(nazwaModelu(x.modelId)), '<span class="mono">' + esc(x.sn) + '</span>', fmtIl(x.modelId, x.ilosc), esc(x.lok)],
        dane: [x.projekt, nazwaModelu(x.modelId), x.sn, x.ilosc, x.lok],
      })), { liczbowe: [3], pusto: 'Nic nie czeka w magazynie pod projekty' });
    } else if (rap === 'minimum' || rap === 'eol') {
      const w = C.stanyModeli(app.st).filter((x) => (rap === 'minimum' ? x.ponizejMin : x.model.status === 'EOL' && x.razem > 0));
      tresc = tabela('raport', rap === 'minimum' ? 'Poniżej stanu minimalnego' : 'Modele EOL na stanie', ['Kategoria', 'Model', 'Kod producenta', 'W magazynie', 'Stan minimalny', 'Status'], w.map((x) => ({
        komorki: [esc(x.model.kategoria || ''), esc(nazwaModelu(x.model.modelId)), esc(x.model.pn || ''), fmtIl(x.model.modelId, x.razem), x.model.stanMin ? fmtIl(x.model.modelId, Number(x.model.stanMin)) : '', esc(x.model.status || 'aktywny')],
        dane: [x.model.kategoria || '', nazwaModelu(x.model.modelId), x.model.pn || '', x.razem, Number(x.model.stanMin) || null, x.model.status || 'aktywny'],
      })), { liczbowe: [3, 4], pusto: 'Brak pozycji' });
    } else if (rap === 'podpis') {
      tresc = listaDokumentow(C.dokumentyLista(app.st).filter((d) => !d.anulowany && !d.skany.length), 'raport');
    } else if (rap === 'historia') {
      const sn = app.filtr.rap_sn || '';
      const e = Array.from(app.st.egzemplarze.values()).filter((x) => sn && C.normKlucz(x.sn).includes(C.normKlucz(sn)));
      tresc = '<div class="filtry"><label class="pole wiersz"><span>Numer seryjny</span><input value="' + esc(sn) + '" data-filtr="rap_sn" data-natychmiast="1" placeholder="wpisz lub wklej"></label></div>' +
        (sn ? (e.length ? e.map((x) => historiaHtml(x)).join('') : '<div class="pusto">Nie znaleziono urządzenia</div>') : '<div class="pusto">Wpisz numer seryjny</div>');
      tabele.raport = { nazwa: 'Historia urządzenia', naglowki: ['Model', 'Nr seryjny', 'Data', 'Dokument', 'Opis'], wiersze: e.flatMap((x) => x.historia.map((h) => [nazwaModelu(x.modelId), x.sn, fmtCzas(h.ts), h.numer || '', h.opis])) };
    }
    return naglowekWidoku('Raporty', 'Każdy raport można wyeksportować do Excela.', przyciskEksportu('raport')) +
      '<div class="zakladki">' + zakladki.map(([k, n]) => '<button class="' + (rap === k ? 'aktywna' : '') + '" data-a="raport" data-r="' + k + '">' + n + '</button>').join('') + '</div>' + tresc;
  };

  function historiaHtml(e) {
    return '<section class="karta"><h3>' + esc(nazwaModelu(e.modelId)) + ' · SN <span class="mono">' + esc(e.sn) + '</span></h3>' +
      '<p>' + (e.status === 'magazyn' ? 'W magazynie: <b>' + esc(e.lok) + '</b>' : 'U klienta: <b>' + esc(e.klient) + '</b>, projekt <b>' + esc(e.projekt) + '</b>') + ' · stan: ' + esc(e.stanTech) + (e.projektZakupu ? ' · kupione pod projekt <b>' + esc(e.projektZakupu) + '</b>' : '') + '</p>' +

  WIDOKI.kartoteka = () => {

      akcja: 'edytujModel" data-id="' + esc(m.modelId),

      dane: [m.kategoria || '', m.producent || '', m.model, m.pn || '', m.ean || '', m.seryjny ? 'tak' : 'nie', m.jednostka || 'szt', Number(m.stanMin) || null, m.status || 'aktywny'],
    })), { pusto: 'Kartoteka jest pusta' });
    return naglowekWidoku('Kartoteka modeli', 'Urządzenia z gwarancją, które trafiają do klienta, śledź po numerze seryjnym. Materiały (kable, korytka) liczone są w metrach lub sztukach.', '<button class="przycisk glowny" data-a="edytujModel">' + ikona('plus') + 'Nowy model</button>' + przyciskEksportu('kartoteka')) +
      '<div class="filtry">' + poleSzukaj('kart', 'Szukaj w kartotece…') + '</div>' + html;
  };

  WIDOKI.klienci = () => {
    const lista = Array.from(app.st.klienci.values()).filter((k) => pasuje('kli', k.nazwa, k.nip, k.adres, k.kontakt)).sort((a, b) => a.nazwa.localeCompare(b.nazwa, 'pl'));
    const html = tabela('klienci', 'Klienci', ['Nazwa', 'NIP', 'Adres', 'Osoba kontaktowa', 'Telefon', 'E-mail'], lista.map((k) => ({
      akcja: 'edytujKlienta" data-id="' + esc(k.klientId),
      komorki: ['<b>' + esc(k.nazwa) + '</b>', esc(k.nip || ''), esc(k.adres || ''), esc(k.kontakt || ''), esc(k.tel || ''), esc(k.email || '')],
      dane: [k.nazwa, k.nip || '', k.adres || '', k.kontakt || '', k.tel || '', k.email || ''],
    })), { pusto: 'Lista klientów jest pusta. Klienta możesz też wpisać ręcznie przy wydaniu.' });
    return naglowekWidoku('Klienci', 'Lista jest pomocą, nie obowiązkiem – przy wydaniu można wpisać dowolnego klienta.', '<button class="przycisk glowny" data-a="edytujKlienta">' + ikona('plus') + 'Nowy klient</button>' + przyciskEksportu('klienci')) +
      '<div class="filtry">' + poleSzukaj('kli', 'Szukaj klienta…') + '</div>' + html;
  };

  WIDOKI.dziennik = () => {
    const lista = app.st.zdarzenia.slice().reverse().filter((ev) => pasuje('dz', C.opisZdarzenia(app.st, ev), osoba(ev.autor), ev.typ));
    const html = tabela('dziennik', 'Dziennik zmian', ['Data i godzina', 'Kto', 'Rodzaj', 'Opis'], lista.slice(0, 500).map((ev) => ({
      komorki: [fmtCzas(ev.ts), esc(osoba(ev.autor)), '<span class="znaczek">' + esc(ev.typ) + '</span>', esc(C.opisZdarzenia(app.st, ev))],
      dane: [fmtCzas(ev.ts), osoba(ev.autor), ev.typ, C.opisZdarzenia(app.st, ev)],

      '<div class="filtry">' + poleSzukaj('dz', 'Szukaj w dzienniku…') + '</div>' + html + (lista.length > 500 ? '<p class="szary maly">Pokazano 500 najnowszych wpisów; eksport zawiera wszystkie.</p>' : '');

  WIDOKI.problemy = () => {
    const p = app.st.problemy;
    return naglowekWidoku('Kontrola spójności', 'Aplikacja sprawdza przy każdym odczycie, czy nikt nie zmienił ani nie usunął plików poza nią i czy synchronizacja nie utworzyła kopii.', '') +
      (p.length ? '<section class="karta"><ul class="problemy">' + p.map((x) => '<li><span class="znaczek">' + esc(x.kod) + '</span> ' + esc(x.opis) + '</li>').join('') + '</ul></section>' +
        '<div class="alert info">Najczęstsza przyczyna: OneDrive jeszcze synchronizuje pliki z innego komputera albo utworzył kopię konfliktową. Poczekaj chwilę i kliknij „Odśwież”. Jeśli uwaga zostaje, sprawdź historię wersji pliku w OneDrive.</div>'
        : '<div class="alert ok">Wszystko w porządku: ' + app.zdarzenia.length + ' plików, bez luk, zmian i konfliktów.</div>');
  };

  WIDOKI.ustawienia = () => {
    const uzytkownicy = Array.from(app.st.uzytkownicy.values()).sort((a, b) => (a.nazwisko + a.imie).localeCompare(b.nazwisko + b.imie, 'pl'));

      tabela('uzytkownicy', 'Użytkownicy', ['Imię i nazwisko', 'E-mail', 'Telefon', 'Status'], uzytkownicy.map((u) => ({
        akcja: 'edytujUzytkownika" data-id="' + esc(u.userId),
        komorki: ['<b>' + esc(u.imie + ' ' + u.nazwisko) + '</b>', esc(u.email || ''), esc(u.tel || ''), u.aktywny === false ? '<span class="znaczek anul">nieaktywny</span>' : '<span class="znaczek ok">aktywny</span>'],
        dane: [u.imie + ' ' + u.nazwisko, u.email || '', u.tel || '', u.aktywny === false ? 'nieaktywny' : 'aktywny'],

      '<p><button class="przycisk" data-a="nowyUzytkownik">' + ikona('plus') + 'Dodaj użytkownika</button> <button class="przycisk" data-a="zmienPin">Zmień mój PIN</button></p></section>' +
      '<section class="karta"><h2>Dane</h2>' +
        '<p>Folder: <b>' + esc(app.store.nazwa) + '</b>' + (app.demo ? ' (tryb demonstracyjny)' : '') + '<br>Plików zdarzeń: ' + app.zdarzenia.length + '<br>Ostatni odczyt: ' + (app.ostatniOdczyt ? fmtCzas(app.ostatniOdczyt.toISOString()) : '') + '</p>' +
        '<p><button class="przycisk" data-a="kopiaTeraz" ' + (app.demo ? 'disabled' : '') + '>Zrób kopię zapasową teraz</button> <button class="przycisk" data-a="pobierzBaze">Pobierz całą bazę (JSON)</button></p>' +
        '<p class="szary maly">Kopia tygodniowa zapisuje się sama do podfolderu <b>kopie</b> przy pierwszym uruchomieniu w danym tygodniu.</p>' +
