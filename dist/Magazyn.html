/* Magazyn · MAASCK – kolory marki: granat #020195, żółty #f8c032 */
:root {
  --marka: #020195;
  --marka-hover: #0a08b8;
  --marka-ciemna: #08075c;
  --marka-tlo: #eceefc;
  --akcent: #f8c032;
  --akcent-ciemny: #e3a913;
  --akcent-tlo: #fff6dc;
  --tlo: #f5f6fa;
  --karta: #ffffff;
  --tekst: #14142b;
  --szary: #63657a;
  --linia: #e3e5ee;
  --linia-mocna: #cdd0de;
  --czerwony: #c8281c;
  --czerwony-tlo: #fdeeec;
  --pomarancz: #a8520a;
  --pomarancz-tlo: #fff4e0;
  --zielony: #157a3c;
  --zielony-tlo: #e7f6ec;
  --fiolet: #5b3a9a;
  --fiolet-tlo: #f1ecfb;
  --promien: 12px;
  --cien: 0 1px 2px rgba(20, 20, 43, .05), 0 2px 10px rgba(20, 20, 43, .04);
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  color: var(--tekst);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--tlo); }
body { line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.015em; display: flex; align-items: center; gap: 8px; }
h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 14px; margin: 16px 0 8px; display: flex; align-items: center; gap: 6px; }
a { color: var(--marka); }
p { margin: 0 0 10px; }
.szary { color: var(--szary); }
.maly { font-size: 12px; }
.nowrap { white-space: nowrap; }
.mono { font-family: "Cascadia Mono", Consolas, "SF Mono", monospace; font-size: 12.5px; }
.ukryty { display: none; }
.czerwony-tekst { color: var(--czerwony); }
.blad-tekst { color: var(--czerwony); display: block; margin-top: 4px; font-size: 12.5px; }
.odstep-gora { margin-top: 20px; }
.przelicz { display: block; color: var(--szary); font-size: 11.5px; font-weight: 400; }
.ik { width: 18px; height: 18px; flex: none; vertical-align: -4px; }

/* ---------------------------------------------------------------- przyciski */
.przycisk {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--linia-mocna); background: var(--karta);
  color: var(--tekst); border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: background .12s, border-color .12s, box-shadow .12s, color .12s;
}
.przycisk:hover { border-color: var(--marka); color: var(--marka); }
.przycisk:focus-visible, .ikonowy:focus-visible, .karta-btn:focus-visible, .pomoc:focus-visible, a:focus-visible, tr[data-a]:focus-visible, .kafel:focus-visible, .osoba:focus-visible, .akcja-duza:focus-visible { outline: 2px solid var(--akcent); outline-offset: 2px; }
.przycisk.glowny { background: var(--marka); border-color: var(--marka); color: #fff; }
.przycisk.glowny:hover { background: var(--marka-hover); border-color: var(--marka-hover); color: #fff; }
.przycisk.akcent { background: var(--akcent); border-color: var(--akcent); color: var(--marka-ciemna); }
.przycisk.akcent:hover { background: var(--akcent-ciemny); border-color: var(--akcent-ciemny); color: var(--marka-ciemna); }
.przycisk.czerwony { background: var(--czerwony); border-color: var(--czerwony); color: #fff; }
.przycisk.czerwony:hover { background: #a91f15; color: #fff; }
.przycisk.czerwony-tekst { color: var(--czerwony); border-color: transparent; background: transparent; margin-right: auto; }
.przycisk.czerwony-tekst:hover { background: var(--czerwony-tlo); color: var(--czerwony); }
.przycisk.tekstowy { border-color: transparent; background: transparent; }
.przycisk.tekstowy:hover { background: var(--marka-tlo); color: var(--marka); }
.przycisk.duzy { padding: 12px 18px; font-size: 15px; width: 100%; }
.przycisk.maly { padding: 4px 10px; font-size: 12.5px; }
.przycisk:disabled { opacity: .45; cursor: not-allowed; }
.ikonowy { border: 0; background: transparent; padding: 6px; border-radius: 6px; cursor: pointer; color: var(--szary); display: inline-grid; place-items: center; }
.ikonowy:hover { background: var(--marka-tlo); color: var(--marka); }
.karta-btn { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; border: 1px solid var(--linia); background: #fff; color: var(--marka); border-radius: 6px; padding: 2px 5px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; vertical-align: middle; }
.karta-btn .ik { width: 15px; height: 15px; vertical-align: 0; }
.karta-btn:hover { background: var(--marka-tlo); border-color: var(--marka); }
.karta-btn.z-tekstem { margin-left: 0; padding: 3px 8px; }

/* ---------------------------------------------------------------- pomoc */
.pomoc {
  display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: var(--marka-tlo); color: var(--marka);
  font-size: 11px; font-weight: 800; cursor: help; flex: none; line-height: 1; user-select: none; vertical-align: middle; letter-spacing: 0; text-transform: none;
}
.pomoc:hover, .pomoc:focus { background: var(--marka); color: #fff; outline: none; }
h1 .pomoc { width: 20px; height: 20px; font-size: 12px; }
.dymek {
  position: fixed; z-index: 100; max-width: 320px; background: var(--marka-ciemna); color: #fff; font-size: 12.5px; line-height: 1.45; padding: 9px 12px;
  border-radius: 8px; box-shadow: 0 8px 24px rgba(8, 7, 92, .28); pointer-events: none; opacity: 0; transform: translateY(2px); transition: opacity .12s, transform .12s; left: -9999px; top: 0;
}
.dymek.widoczny { opacity: 1; transform: none; }

/* ---------------------------------------------------------------- ekran startowy */
.start {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 14px;
  background: radial-gradient(1200px 600px at 85% -10%, rgba(248, 192, 50, .28), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(2, 1, 149, .18), transparent 60%), var(--tlo);
}
.karta-startowa { width: 100%; max-width: 460px; background: var(--karta); border-radius: 18px; padding: 36px; box-shadow: 0 16px 50px rgba(8, 7, 92, .12); display: flex; flex-direction: column; gap: 12px; }
.karta-startowa h1 { font-size: 30px; margin-top: 6px; }
.logo-start { height: 40px; align-self: flex-start; }
.stopka-start { color: var(--szary); font-size: 12px; margin: 0; }
.separator { display: flex; align-items: center; gap: 12px; color: var(--szary); font-size: 12px; margin: 6px 0; }
.separator::before, .separator::after { content: ""; flex: 1; border-top: 1px solid var(--linia); }
.lista-osob { display: grid; gap: 8px; }
.osoba { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--linia); border-radius: 10px; background: var(--karta); cursor: pointer; font: inherit; font-weight: 600; text-align: left; transition: border-color .12s, background .12s; }
.osoba:hover { border-color: var(--marka); background: var(--marka-tlo); }
.awatar { width: 30px; height: 30px; border-radius: 50%; background: var(--akcent); color: var(--marka-ciemna); display: inline-grid; place-items: center; font-weight: 800; font-size: 12px; flex: none; }

/* ---------------------------------------------------------------- układ */
.uklad { display: grid; grid-template-columns: 248px 1fr; height: 100vh; }
.boczny { background: var(--marka-ciemna); color: #e6e7f5; display: flex; flex-direction: column; padding: 20px 12px 14px; gap: 16px; overflow-y: auto; }
.marka { display: flex; align-items: flex-end; gap: 10px; padding: 4px 10px 8px; }
.marka img { height: 24px; display: block; }
.marka span { font-weight: 600; color: var(--akcent); font-size: 13px; letter-spacing: .02em; padding-bottom: 1px; }
.szybkie { display: grid; gap: 6px; padding: 0 4px; }
.szybkie .przycisk { justify-content: flex-start; }
.szybkie .przycisk:not(.akcent) { background: transparent; color: #e6e7f5; border-color: rgba(255, 255, 255, .22); }
.szybkie .przycisk:not(.akcent):hover { border-color: #fff; color: #fff; }
nav { display: flex; flex-direction: column; gap: 2px; }
.boczny nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: #c9cbe6; text-decoration: none; font-weight: 500; }
.boczny nav a:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.boczny nav a.aktywny { background: rgba(248, 192, 50, .16); color: #fff; box-shadow: inset 3px 0 0 var(--akcent); }
.boczny nav a.aktywny .ik { color: var(--akcent); }
.boczny nav hr { border: 0; border-top: 1px solid rgba(255, 255, 255, .12); margin: 8px 4px; }
.licznik { margin-left: auto; background: rgba(255, 255, 255, .18); color: #fff; border-radius: 10px; padding: 0 7px; font-size: 11.5px; font-weight: 700; }
.licznik.czerwony { background: var(--czerwony); }
.wersja { margin-top: auto; color: rgba(255, 255, 255, .4); font-size: 11.5px; padding: 0 10px; }
.glowna { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.gora { display: flex; align-items: center; gap: 6px; padding: 10px 24px; border-bottom: 1px solid var(--linia); background: var(--karta); }
.gora .szary .ik { width: 16px; height: 16px; }
.odstep { flex: 1; }
.uzytkownik { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--linia); background: var(--karta); border-radius: 20px; padding: 3px 12px 3px 3px; font: inherit; font-weight: 600; cursor: pointer; margin-left: 6px; }
.uzytkownik:hover { border-color: var(--marka); }
.zawartosc { flex: 1; overflow-y: auto; padding: 24px 28px; }
.zawartosc > * { max-width: 1280px; }
.naglowek-widoku { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.naglowek-widoku .przyciski { display: flex; gap: 8px; flex-wrap: wrap; }
.naglowek-widoku p { margin: 0; }
.wstecz { margin: -10px 0 4px -14px; }

/* ---------------------------------------------------------------- karty i kafle */
.karta { background: var(--karta); border: 1px solid var(--linia); border-radius: var(--promien); padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--cien); }
.karta-naglowek { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.karta-naglowek a { font-size: 13px; font-weight: 600; text-decoration: none; }
.dwie-kolumny { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.kafle { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kafel { position: relative; text-align: left; background: var(--karta); border: 1px solid var(--linia); border-radius: var(--promien); padding: 14px 16px; cursor: pointer; font: inherit; box-shadow: var(--cien); display: flex; flex-direction: column; gap: 2px; transition: border-color .12s, transform .12s; }
.kafel:hover { border-color: var(--marka); transform: translateY(-1px); }
.kafel b { font-size: 28px; letter-spacing: -.02em; color: var(--marka); line-height: 1.15; }
.kafel > span:last-child { color: var(--szary); font-size: 12.5px; }
.kafel-ik { position: absolute; right: 12px; top: 12px; color: #b8bbd2; }
.kafel.czerwony { border-color: #f0b8b2; background: var(--czerwony-tlo); }
.kafel.czerwony b, .kafel.czerwony .kafel-ik { color: var(--czerwony); }
.kafel.pomaranczowy b, .kafel.pomaranczowy .kafel-ik { color: var(--pomarancz); }
.pierwsze-kroki { border-left: 4px solid var(--akcent); }
.pierwsze-kroki ol { margin: 0 0 14px; padding-left: 20px; }
.pierwsze-kroki li { margin-bottom: 6px; }
.pierwsze-kroki .przyciski { display: flex; gap: 8px; flex-wrap: wrap; }
.szybkie-duze { display: grid; gap: 8px; }
.akcja-duza { display: grid; grid-template-columns: 30px 1fr; grid-template-rows: auto auto; column-gap: 10px; text-align: left; padding: 12px; border: 1px solid var(--linia); border-radius: 10px; background: var(--karta); cursor: pointer; font: inherit; transition: border-color .12s, background .12s; }
.akcja-duza:hover { border-color: var(--marka); background: var(--marka-tlo); }
.akcja-duza .ik { grid-row: span 2; width: 22px; height: 22px; margin-top: 2px; color: var(--marka); }
.akcja-duza span { color: var(--szary); font-size: 12.5px; }

/* ---------------------------------------------------------------- alerty i znaczki */
.alert { border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; border: 1px solid; }
.alert.info { background: var(--marka-tlo); border-color: #cfd3f4; }
.alert.ok { background: var(--zielony-tlo); border-color: #bfe3cc; }
.alert.ostrz { background: var(--pomarancz-tlo); border-color: #f5d6a6; }
.alert.blad { background: var(--czerwony-tlo); border-color: #f0b8b2; color: #7d1a12; }
.wzz-alert { background: var(--czerwony-tlo); border: 2px solid var(--czerwony); color: #6e150e; margin-top: 14px; }
.wzz-alert .pole { margin-top: 10px; }
.znaczek { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 11.5px; font-weight: 700; background: #eceef4; color: #4a4c63; white-space: nowrap; }
.znaczek.r-PZ, .znaczek.r-BO { background: var(--zielony-tlo); color: var(--zielony); }
.znaczek.r-WZ { background: var(--marka-tlo); color: var(--marka); }
.znaczek.r-WZZ { background: var(--czerwony); color: #fff; }
.znaczek.r-ZW { background: var(--fiolet-tlo); color: var(--fiolet); }
.znaczek.anul { background: #eceef4; color: #6b6d82; text-decoration: line-through; }
.znaczek.brak { background: var(--czerwony-tlo); color: var(--czerwony); }
.znaczek.ok { background: var(--zielony-tlo); color: var(--zielony); }
.znaczek.wyd { background: var(--marka-tlo); color: var(--marka); }
.znaczek.eol { background: var(--pomarancz-tlo); color: var(--pomarancz); }
.znaczek.projekt { background: var(--akcent-tlo); color: #6b4e00; }
.znaczek.demo { background: var(--akcent); color: var(--marka-ciemna); }

/* ---------------------------------------------------------------- tabele */
.tabela-owijka { overflow-x: auto; border: 1px solid var(--linia); border-radius: 10px; background: var(--karta); }
.tabela-owijka.wysokosc { max-height: 440px; overflow-y: auto; }
.tabela { width: 100%; border-collapse: collapse; }
.tabela th { position: sticky; top: 0; background: #f8f9fc; text-align: left; font-size: 12px; font-weight: 600; color: var(--szary); padding: 9px 12px; border-bottom: 1px solid var(--linia); white-space: nowrap; z-index: 1; }
.tabela td { padding: 9px 12px; border-bottom: 1px solid #eef0f5; vertical-align: middle; }
.tabela tr:last-child td { border-bottom: 0; }
.tabela .l { text-align: right; white-space: nowrap; }
.tabela tr[data-a] { cursor: pointer; }
.tabela tbody tr:hover td { background: #f8f9ff; }
.tabela tr.anulowany td { color: #9a9cae; text-decoration: line-through; }
.tabela tr.anulowany td .znaczek { text-decoration: none; }
.tabela tr.wzz td { background: #fff6f5; }
.tabela tr.wzz td:first-child { box-shadow: inset 3px 0 0 var(--czerwony); }
.tabela tr.inny-projekt td { color: #7d1a12; }
.tabela tr.ostrz td:first-child { box-shadow: inset 3px 0 0 var(--pomarancz); }
.tabela tr.zamkniete td { color: var(--szary); }
.akcje-wiersza { text-align: right; white-space: nowrap; }
.w-ilosc { width: 90px; text-align: right; }
.pusto { padding: 28px; text-align: center; color: var(--szary); border: 1px dashed var(--linia-mocna); border-radius: 10px; background: rgba(255, 255, 255, .6); }

/* ---------------------------------------------------------------- filtry i pola */
.filtry { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.szukaj { position: relative; flex: 1; min-width: 240px; max-width: 520px; }
.szukaj .ik { position: absolute; left: 10px; top: 10px; color: var(--szary); }
.szukaj input { width: 100%; padding-left: 36px; }
input, select, textarea { font: inherit; color: inherit; border: 1px solid var(--linia-mocna); border-radius: 8px; padding: 8px 10px; background: #fff; min-width: 0; transition: border-color .12s, box-shadow .12s; }
input:hover, select:hover, textarea:hover { border-color: #b3b7cc; }
input:focus, select:focus, textarea:focus { border-color: var(--marka); outline: none; box-shadow: 0 0 0 3px rgba(2, 1, 149, .14); }
input[type=checkbox] { width: 17px; height: 17px; padding: 0; margin: 0; accent-color: var(--marka); cursor: pointer; flex: none; }
textarea { resize: vertical; width: 100%; }
input.pin { font-size: 22px; letter-spacing: .4em; text-align: center; width: 190px; }
.przelacznik { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.siatka { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 16px; }
.pole { display: flex; flex-direction: column; gap: 5px; }
.pole > span { font-size: 12px; font-weight: 600; color: var(--szary); display: flex; align-items: center; gap: 6px; }
.pole.szerokie { grid-column: 1 / -1; }
.pole.wiersz { flex-direction: row; align-items: center; gap: 10px; }
.pole.wiersz > span { white-space: nowrap; }
.pole input:not([type=checkbox]), .pole select { width: 100%; }
.pole-projekt { grid-column: span 2; }
.wiersz-projekt { display: flex; align-items: center; gap: 14px; min-height: 38px; }
.wiersz-projekt .wejscie-projekt { flex: 1; max-width: 280px; }
.wiersz-modelu, .wiersz-linku { display: flex; align-items: center; gap: 8px; }
.wiersz-modelu input, .wiersz-linku input { flex: 1; }
.wiersz-modelu .karta-btn { margin-left: 0; padding: 7px 9px; }
.plik-karty { flex: 1; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; }
.plik-karty .ik { color: var(--marka); }
h3.sekcja { margin: 18px 0 10px; padding-top: 14px; border-top: 1px solid var(--linia); color: var(--marka); text-transform: uppercase; font-size: 12px; letter-spacing: .06em; }
.okno-tresc > h3.sekcja:first-of-type { border-top: 0; padding-top: 0; margin-top: 4px; }
.karta-katalogowa { display: grid; gap: 12px; }
.ilosc { display: flex; gap: 6px; }
.ilosc input { flex: 1; }
.ilosc select { width: auto !important; }
.pozycja { display: grid; grid-template-columns: 32px 1fr 32px; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--linia); align-items: start; }
.pozycja:first-of-type { padding-top: 0; }
.pozycja-nr { width: 26px; height: 26px; border-radius: 50%; background: var(--marka-tlo); color: var(--marka); display: grid; place-items: center; font-weight: 700; font-size: 12px; margin-top: 22px; }
.licznik-pozycji { background: var(--marka-tlo); color: var(--marka); border-radius: 10px; padding: 0 8px; font-size: 12px; }
.przyciski-pozycji { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.stopka-formularza { display: flex; justify-content: flex-end; gap: 10px; padding: 8px 0 40px; }
.zakladki { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1px solid var(--linia); }
.zakladki button { border: 0; background: transparent; font: inherit; font-weight: 600; padding: 9px 12px; cursor: pointer; color: var(--szary); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.zakladki button:hover { color: var(--marka); }
.zakladki button.aktywna { color: var(--marka); border-bottom-color: var(--akcent); }
dl.opis { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; margin: 0 0 14px; }
dl.opis dt { color: var(--szary); font-size: 12.5px; }
dl.opis dd { margin: 0; }
.os-czasu { margin: 0; padding-left: 18px; }
.os-czasu li { margin-bottom: 6px; }
.problemy { margin: 0; padding-left: 18px; }
.problemy li { margin-bottom: 6px; }
.naglowek-firmy { display: flex; gap: 20px; align-items: center; }
.naglowek-firmy img { height: 34px; }

/* ---------------------------------------------------------------- instrukcja */
.uklad-pomocy { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
.spis { position: sticky; top: 0; display: flex; flex-direction: column; gap: 2px; background: var(--karta); border: 1px solid var(--linia); border-radius: var(--promien); padding: 14px; }
.spis b { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--szary); margin-bottom: 6px; }
.spis a { text-decoration: none; padding: 5px 8px; border-radius: 6px; font-weight: 500; }
.spis a:hover { background: var(--marka-tlo); }
.instrukcja { scroll-margin-top: 10px; }
.instrukcja ol, .instrukcja ul { margin: 0; padding-left: 20px; }
.instrukcja li { margin-bottom: 7px; }
.faq { margin: 0; }
.faq dt { font-weight: 700; margin-top: 10px; }
.faq dd { margin: 2px 0 0; color: #34364d; }

/* ---------------------------------------------------------------- okna */
.tlo-modal { position: fixed; inset: 0; background: rgba(8, 7, 60, .42); display: grid; place-items: center; padding: 20px; z-index: 50; animation: pojaw .12s ease-out; }
.okno { background: var(--karta); border-radius: 14px; width: 100%; max-width: 480px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; box-shadow: 0 24px 70px rgba(8, 7, 60, .3); animation: wjazd .16s ease-out; }
.okno.szerokie { max-width: 880px; }
.okno-naglowek { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 8px; }
.okno-naglowek h2 { margin: 0; font-size: 18px; }
.okno-tresc { padding: 8px 22px; overflow-y: auto; }
.okno-stopka { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 18px; border-top: 1px solid var(--linia); margin-top: 8px; flex-wrap: wrap; }
@keyframes pojaw { from { opacity: 0; } to { opacity: 1; } }
@keyframes wjazd { from { transform: translateY(6px) scale(.99); } to { transform: none; } }
#toasty { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--marka-ciemna); color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgba(8, 7, 60, .25); max-width: 420px; transition: opacity .5s, transform .5s; }
.toast.ok { border-left: 4px solid var(--akcent); }
.toast.blad { background: var(--czerwony); }
.toast.znika { opacity: 0; transform: translateY(8px); }

@media (max-width: 1000px) {
  .uklad-pomocy { grid-template-columns: 1fr; }
  .spis { position: static; }
}
@media (max-width: 900px) {
  .uklad { grid-template-columns: 1fr; height: auto; }
  .boczny { height: auto; }
  .glowna { height: auto; }
  .dwie-kolumny { grid-template-columns: 1fr; }
  .pole-projekt { grid-column: auto; }
}

/* ---------------------------------------------------------------- wydruk */
#druk { display: none; }
@page { size: A4; margin: 14mm 12mm; }
@media print {
  body { background: #fff; }
  #app, #modal, #toasty, .dymek { display: none !important; }
  #druk { display: block; }
  .arkusz { font-size: 10.5pt; color: #000; position: relative; }
  .znak-wodny { position: fixed; top: 40%; left: 0; right: 0; text-align: center; font-size: 80pt; font-weight: 800; color: rgba(200, 40, 28, .18); transform: rotate(-25deg); }
  .d-naglowek { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #020195; padding-bottom: 8px; margin-bottom: 12px; }
  .d-logo { height: 11mm; }
  .d-firma { text-align: right; font-size: 8.5pt; line-height: 1.4; }
  .d-tytul { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .d-rodzaj { font-size: 11pt; text-transform: uppercase; letter-spacing: .05em; color: #020195; }
  .d-numer { font-size: 20pt; font-weight: 800; }
  .d-qr { width: 22mm; height: 22mm; }
  .d-qr svg { width: 100%; height: 100%; }
  .d-wzz { border: 3px solid #c8281c; color: #c8281c; padding: 8px 10px; margin-bottom: 10px; font-size: 11pt; }
  .d-meta { border-collapse: collapse; margin-bottom: 12px; width: 100%; }
  .d-meta th { text-align: left; width: 40mm; font-weight: 600; padding: 2px 8px 2px 0; vertical-align: top; color: #333; }
  .d-meta td { padding: 2px 0; }
  .d-pozycje { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .d-pozycje th, .d-pozycje td { border: 1px solid #555; padding: 4px 6px; text-align: left; vertical-align: top; }
  .d-pozycje th { background: #eef0fb; font-size: 9pt; }
  .d-pozycje .l { text-align: right; white-space: nowrap; }
  .d-pozycje { font-size: 9.5pt; }
  .d-pozycje .d-sn { white-space: nowrap; font-family: Consolas, monospace; font-size: 9pt; }
  .d-pozycje .d-lp { width: 8mm; text-align: center; }
  .d-pozycje tr.d-zast td { color: #c8281c; font-weight: 600; }
  .d-uwagi { margin: 8px 0; }
  .d-podpisy { display: flex; gap: 20mm; margin-top: 22mm; page-break-inside: avoid; }
  .d-podpisy > div { flex: 1; text-align: center; font-size: 9.5pt; }
  .d-linia { border-top: 1px solid #000; margin-bottom: 4px; }
  .d-stopka { margin-top: 14mm; font-size: 7.5pt; color: #555; border-top: 1px solid #ccc; padding-top: 4px; display: flex; justify-content: space-between; gap: 10mm; }
}

</style>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],
      [6, 28, 50, 72, 94],
      [6, 26, 50, 74, 98],
      [6, 30, 54, 78, 102],

        st.wgNumeru.set(d.numer, lista);
        if (lista.length > 1) problem(st, 'DUPLIKAT', 'Numer ' + d.numer + ' występuje więcej niż raz (zapis w tej samej chwili na dwóch komputerach?)', ev.id);
        if (d.projekt) st.projekty.add(norm(d.projekt));
        if (anul) break;
        zastosujDokument(st, ev);
        break;
      }
      case 'ANUL': {
        if (!st.dokumenty.has(d.docId)) problem(st, 'ANUL', 'Anulowanie dotyczy nieznanego dokumentu ' + (d.numer || d.docId), ev.id);
        break;
      }
      case 'PRZENIES': {
        przenies(st, ev);
        break;
      }
      case 'SKAN': {
        const doc = st.dokumenty.get(d.docId);
        if (doc) doc.skany.push({ plik: d.plik, ts: ev.ts, autor: ev.autor });
        else problem(st, 'SKAN', 'Skan dotyczy nieznanego dokumentu ' + (d.numer || d.docId), ev.id);
        break;
      }
      case 'UZUP': {
        const poz = st.uzupelnienia.find((u) => u.docId === d.docId && u.idx === d.idx);
        if (poz) {
          poz.zamkniete = true;
          poz.zamknieto = { ts: ev.ts, autor: ev.autor, uwagi: d.uwagi || '' };
        } else if (!(st.dokumenty.get(d.docId) || {}).anulowany) problem(st, 'UZUP', 'Uzupełnienie dotyczy nieznanej pozycji', ev.id);
        break;
      }
      default:
        problem(st, 'TYP', 'Nieznany typ zdarzenia: ' + ev.typ, ev.id);
    }
  }

  function zastosujDokument(st, ev) {
    const d = ev.dane;
    const kier = (RODZAJE[d.rodzaj] || {}).kierunek;
    (d.pozycje || []).forEach((p, idx) => {
      const model = st.modele.get(p.modelId);
      if (!model) {
        problem(st, 'MODEL', d.numer + ': pozycja ' + (idx + 1) + ' wskazuje nieznany model', ev.id);
        return;
      }
      const seryjny = !!p.sn;
      if (p.lok) st.lokalizacje.add(norm(p.lok));
      if (p.projekt) st.projekty.add(norm(p.projekt));
      const hist = { numer: d.numer, docId: ev.id, ts: ev.ts, rodzaj: d.rodzaj };

      if (kier === 'przyjecie') {
        if (seryjny) {
          const k = kluczEgz(p.modelId, p.sn);
          const e = st.egzemplarze.get(k);
          if (e && e.status === 'magazyn') {
            problem(st, 'SN', d.numer + ': ' + opisModelu(st, p.modelId) + ' SN ' + p.sn + ' jest już na stanie', ev.id);
            return;
          }
          st.egzemplarze.set(k, {
            modelId: p.modelId, sn: norm(p.sn), status: 'magazyn', lok: norm(p.lok),
            projektZakupu: norm(p.projekt), stanTech: p.stanTech || 'nowy', klient: '', projekt: '',
            przyjeto: { numer: d.numer, ts: ev.ts },
            gwarancjaDo: p.gwarancjaDo || (e && e.gwarancjaDo) || '',
            historia: (e ? e.historia : []).concat([Object.assign(hist, { opis: 'Przyjęto na ' + norm(p.lok) + (p.projekt ? ' (pod projekt ' + norm(p.projekt) + ')' : '') })]),
          });
        } else {
          const k = kluczPartii(p.modelId, p.lok, p.projekt);
          st.partie.set(k, zaokr((st.partie.get(k) || 0) + zaokr(p.ilosc)));
        }
      } else if (kier === 'wydanie') {
        if (seryjny) {
          const k = kluczEgz(p.modelId, p.sn);
          const e = st.egzemplarze.get(k);
          if (!e || e.status !== 'magazyn') {
            problem(st, 'SN', d.numer + ': ' + opisModelu(st, p.modelId) + ' SN ' + p.sn + ' nie jest na stanie', ev.id);
            return;
          }
          e.status = 'wydany';
          e.historia.push(Object.assign(hist, { opis: 'Wydano z ' + e.lok + ' na projekt ' + norm(d.projekt) + (d.klientNazwa ? ' (' + d.klientNazwa + ')' : '') }));
          const zrodloProj = e.projektZakupu;
          e.lok = '';
          e.klient = d.klientNazwa || '';
          e.projekt = norm(d.projekt);
          e.wydanie = { numer: d.numer, ts: ev.ts };
          if (d.rodzaj === 'WZZ' && zrodloProj && normKlucz(zrodloProj) !== normKlucz(d.projekt)) {
            st.uzupelnienia.push({ docId: ev.id, numer: d.numer, idx, modelId: p.modelId, sn: e.sn, ilosc: 1, projektZakupu: zrodloProj, projektDocelowy: norm(d.projekt), powod: d.powod || '', ts: ev.ts, zamkniete: false });
          }
        } else {
          const k = kluczPartii(p.modelId, p.lok, p.projektZakupu);
          const jest = st.partie.get(k) || 0;
          const ile = zaokr(p.ilosc);
          if (jest + 1e-9 < ile) {
            problem(st, 'ILOSC', d.numer + ': ' + opisModelu(st, p.modelId) + ' – brak ' + ile + ' ' + jm(st, p.modelId) + ' w lokalizacji ' + norm(p.lok) + (p.projektZakupu ? ' (pod projekt ' + p.projektZakupu + ')' : '') + ', jest ' + jest + ' ' + jm(st, p.modelId), ev.id);
          }
          st.partie.set(k, zaokr(jest - ile));
          const kw = kluczWydania(d.projekt, p.modelId);
          st.wydane.set(kw, zaokr((st.wydane.get(kw) || 0) + ile));
          st.wydaneKlient.set(kw, d.klientNazwa || '');
          if (d.rodzaj === 'WZZ' && p.projektZakupu && normKlucz(p.projektZakupu) !== normKlucz(d.projekt)) {
            st.uzupelnienia.push({ docId: ev.id, numer: d.numer, idx, modelId: p.modelId, sn: '', ilosc: ile, projektZakupu: norm(p.projektZakupu), projektDocelowy: norm(d.projekt), powod: d.powod || '', ts: ev.ts, zamkniete: false });
          }
        }
      } else if (kier === 'zwrot') {
        if (seryjny) {
          const k = kluczEgz(p.modelId, p.sn);
          const e = st.egzemplarze.get(k);
          if (!e || e.status !== 'wydany') {
            problem(st, 'SN', d.numer + ': ' + opisModelu(st, p.modelId) + ' SN ' + p.sn + ' nie był wydany', ev.id);
            return;
          }
          if (normKlucz(e.projekt) !== normKlucz(d.projekt)) {
            problem(st, 'ZW', d.numer + ': SN ' + p.sn + ' był wydany na projekt ' + e.projekt + ', a nie ' + norm(d.projekt), ev.id);
          }
          e.status = 'magazyn';
          e.lok = norm(p.lok);
          e.stanTech = p.stanTech || e.stanTech;
          e.historia.push(Object.assign(hist, { opis: 'Zwrot z projektu ' + e.projekt + ' na ' + norm(p.lok) + ' (' + e.stanTech + ')' }));
          e.klient = '';
          e.projekt = '';
          e.projektZakupu = '';
          e.wydanie = null;
        } else {
          const kw = kluczWydania(d.projekt, p.modelId);
          const wyd = st.wydane.get(kw) || 0;
          const ile = zaokr(p.ilosc);
          if (wyd + 1e-9 < ile) problem(st, 'ILOSC', d.numer + ': zwrot ' + ile + ' ' + jm(st, p.modelId) + ' ' + opisModelu(st, p.modelId) + ' to więcej, niż wydano na projekt ' + d.projekt + ' (' + wyd + ' ' + jm(st, p.modelId) + ')', ev.id);
          st.wydane.set(kw, zaokr(wyd - ile));
          const k = kluczPartii(p.modelId, p.lok, '');
          st.partie.set(k, zaokr((st.partie.get(k) || 0) + ile));
        }
      }
    });
  }

  function przenies(st, ev) {
    const d = ev.dane;
    if (d.do) st.lokalizacje.add(norm(d.do));
    if (d.sn) {
      const e = st.egzemplarze.get(kluczEgz(d.modelId, d.sn));
      if (!e || e.status !== 'magazyn') {
        problem(st, 'SN', 'Przeniesienie: ' + opisModelu(st, d.modelId) + ' SN ' + d.sn + ' nie jest na stanie', ev.id);
        return;
      }
      e.historia.push({ ts: ev.ts, rodzaj: 'PRZENIES', opis: 'Przeniesiono z „' + e.lok + '” do „' + norm(d.do) + '”' });
      e.lok = norm(d.do);
    } else {
      const kz = kluczPartii(d.modelId, d.z, d.projekt);
      const jest = st.partie.get(kz) || 0;
      const ile = zaokr(d.ilosc);
      if (jest + 1e-9 < ile) problem(st, 'ILOSC', 'Przeniesienie: brak ' + ile + ' ' + jm(st, d.modelId) + ' ' + opisModelu(st, d.modelId) + ' w lokalizacji ' + d.z + ', jest ' + jest + ' ' + jm(st, d.modelId), ev.id);
      st.partie.set(kz, zaokr(jest - ile));
      const kd = kluczPartii(d.modelId, d.do, d.projekt);
      st.partie.set(kd, zaokr((st.partie.get(kd) || 0) + ile));
    }
  }

  function kontrolaSpojnosci(st) {
    // luki w numeracji dokumentów
    const maks = new Map();
    const sa = new Set();
    for (const { ev } of st.dokumenty.values()) {
      const k = ev.dane.rodzaj + '/' + ev.dane.rok;
      maks.set(k, Math.max(maks.get(k) || 0, ev.dane.nr));
      sa.add(k + '/' + ev.dane.nr);
    }
    for (const [k, m] of maks) {
      for (let i = 1; i < m; i++) {
        if (!sa.has(k + '/' + i)) {
          const [rodzaj, rok] = k.split('/');
          problem(st, 'LUKA', 'Brakuje dokumentu ' + formatNumer(rodzaj, rok, i) + ' (plik usunięty lub jeszcze się synchronizuje)');
        }
      }
    }
    // luki w numeracji zdarzeń użytkownika
    const wgAutora = new Map();
    for (const ev of st.zdarzenia) {
      if (!wgAutora.has(ev.autor)) wgAutora.set(ev.autor, new Set());
      wgAutora.get(ev.autor).add(Number(ev.seq) || 0);
    }
    for (const [autor, zbior] of wgAutora) {
      const m = Math.max(...zbior);
      const brak = [];
      for (let i = 1; i <= m; i++) if (!zbior.has(i)) brak.push(i);
      if (brak.length) {
        const u = st.uzytkownicy.get(autor);
        problem(st, 'LUKA', 'Brakuje ' + brak.length + ' zdarzeń użytkownika ' + (u ? u.imie + ' ' + u.nazwisko : autor) + ' (nr ' + brak.slice(0, 5).join(', ') + (brak.length > 5 ? '…' : '') + ')');
      }
    }
  }

  // ---------------------------------------------------------------- tworzenie zdarzeń

  function noweZdarzenie(st, typ, autor, dane, teraz) {
    const ts = (teraz || new Date()).toISOString();
    return { v: WERSJA, id: noweId(), typ, ts, autor, seq: (st.seqMax.get(autor) || 0) + 1, dane };
  }

  function nastepnyNumer(st, rodzaj, rok) {
    let m = 0;
    for (const { ev } of st.dokumenty.values()) if (ev.dane.rodzaj === rodzaj && ev.dane.rok === rok) m = Math.max(m, ev.dane.nr);
    return m + 1;
  }

  /** Czy wydanie z danej partii/egzemplarza na projekt docelowy jest wydaniem zastępczym. */
  function czyZastepcze(projektZakupu, projektDocelowy) {
    return !!norm(projektZakupu) && normKlucz(projektZakupu) !== normKlucz(projektDocelowy);
  }

  /**
   * Przygotowuje zdarzenie dokumentu z nadanym numerem.
   * dane: {rodzaj, data, projekt, klientId, klientNazwa, adres, dostawca, nrFaktury, osoba, uwagi, powod, pozycje}
   */
  function przygotujDokument(st, autor, dane, teraz) {
    const t = teraz || new Date();
    const rok = Number((dane.data || t.toISOString()).slice(0, 4));
    const rodzaj = dane.rodzaj;
    const nr = nastepnyNumer(st, rodzaj, rok);
    const tresc = Object.assign({}, dane, { rodzaj, rok, nr, numer: formatNumer(rodzaj, rok, nr) });
    return noweZdarzenie(st, 'DOK', autor, tresc, t);
  }

  /** Zwraca listę problemów, które spowodowałoby dodanie zdarzenia (pusta lista = OK). */
  function sprawdzNowe(zdarzenia, ev) {
    const przed = zbudujStan(zdarzenia, { bezKontroli: true });
    const po = zbudujStan(zdarzenia.concat([ev]), { bezKontroli: true });
    const klucz = (p) => p.kod + '|' + p.opis;
    const bylo = new Set(przed.problemy.map(klucz));
    return po.problemy.filter((p) => !bylo.has(klucz(p))).map((p) => p.opis);
  }

  function walidujDokument(st, d) {
    const bledy = [];
    const r = RODZAJE[d.rodzaj];
    if (!r) bledy.push('Nieznany rodzaj dokumentu');
    if (!d.pozycje || !d.pozycje.length) bledy.push('Dokument nie ma żadnej pozycji');
    if (r && r.kierunek === 'wydanie' && !norm(d.projekt)) bledy.push('Podaj numer projektu, na który wydajesz sprzęt');
    if (r && r.kierunek === 'wydanie' && !norm(d.klientNazwa)) bledy.push('Podaj klienta');
    if (r && r.kierunek === 'zwrot' && !norm(d.projekt)) bledy.push('Podaj numer projektu, z którego wraca sprzęt');
    if (d.rodzaj === 'PZ' && !norm(d.dostawca)) bledy.push('Podaj dostawcę');
    if (d.rodzaj === 'WZZ' && !norm(d.powod)) bledy.push('Wydanie zastępcze wymaga powodu');
    (d.pozycje || []).forEach((p, i) => {
      const m = st.modele.get(p.modelId);
      const n = 'Pozycja ' + (i + 1) + ': ';
      if (!m) { bledy.push(n + 'wybierz model'); return; }
      if (m.seryjny && !norm(p.sn)) bledy.push(n + 'podaj numer seryjny');
      if (!m.seryjny && !(Number(p.ilosc) > 0)) bledy.push(n + 'ilość musi być większa od zera');
      if (r && (r.kierunek === 'przyjecie' || r.kierunek === 'zwrot') && !norm(p.lok)) bledy.push(n + 'podaj lokalizację');
    });
    // powtórzone numery seryjne w jednym dokumencie
    const sn = new Set();
    for (const p of d.pozycje || []) {
      if (!p.sn) continue;
      const k = kluczEgz(p.modelId, p.sn);
      if (sn.has(k)) bledy.push('Numer seryjny ' + p.sn + ' występuje w dokumencie dwa razy');
      sn.add(k);
    }
    // wydanie zastępcze musi być oznaczone jako WZZ
    if (r && r.kierunek === 'wydanie') {
      const zast = (d.pozycje || []).some((p) => czyZastepcze(p.projektZakupu, d.projekt));
      if (zast && d.rodzaj !== 'WZZ') bledy.push('Dokument zawiera sprzęt kupiony pod inny projekt – musi to być wydanie zastępcze (WZZ)');
      if (!zast && d.rodzaj === 'WZZ') bledy.push('Wydanie zastępcze bez sprzętu z innego projektu – użyj zwykłego WZ');
    }
    return bledy;
  }

  // ---------------------------------------------------------------- zestawienia

  function stanyModeli(st) {
    const wynik = new Map();
    for (const [id, m] of st.modele) wynik.set(id, { model: m, wolne: 0, podProjekt: 0, projekty: new Map(), wydane: 0 });
    for (const [k, ilosc] of st.partie) {
      if (Math.abs(ilosc) < 1e-9) continue;
      const [modelId, , projekt] = k.split('|');
      const w = wynik.get(modelId);
      if (!w) continue;
      if (projekt) {
        w.podProjekt = zaokr(w.podProjekt + ilosc);
        w.projekty.set(projekt, zaokr((w.projekty.get(projekt) || 0) + ilosc));
      } else w.wolne = zaokr(w.wolne + ilosc);
    }
    for (const e of st.egzemplarze.values()) {
      const w = wynik.get(e.modelId);
      if (!w) continue;
      if (e.status === 'magazyn') {
        if (e.projektZakupu) {
          w.podProjekt += 1;
          w.projekty.set(e.projektZakupu, (w.projekty.get(e.projektZakupu) || 0) + 1);
        } else w.wolne += 1;
      } else if (e.status === 'wydany') w.wydane += 1;
    }
    for (const [k, ilosc] of st.wydane) {
      const modelId = k.split('|').pop();
      const w = wynik.get(modelId);
      if (w) w.wydane = zaokr(w.wydane + ilosc);
    }
    return Array.from(wynik.values()).map((w) => Object.assign(w, {
      razem: zaokr(w.wolne + w.podProjekt),
      ponizejMin: Number(w.model.stanMin) > 0 && w.wolne + w.podProjekt < Number(w.model.stanMin),
    }));
  }

  /** Wiersze: co leży w magazynie, w podziale na lokalizacje (do wydania, przeniesienia, raportów). */
  function wierszeMagazynu(st) {
    const w = [];
    for (const [k, ilosc] of st.partie) {
      if (Math.abs(ilosc) < 1e-9) continue;
      const [modelId, lok, projekt] = k.split('|');
      w.push({ modelId, lok, projekt, ilosc, sn: '' });
    }
    for (const e of st.egzemplarze.values()) {
      if (e.status !== 'magazyn') continue;
      w.push({ modelId: e.modelId, lok: e.lok, projekt: e.projektZakupu, ilosc: 1, sn: e.sn, stanTech: e.stanTech });
    }
    return w;
  }

  /** Co jest wydane na dany projekt (do zwrotów i raportów). */
  function wydaneNaProjekt(st, projekt) {
    const p = normKlucz(projekt);
    const w = [];
    for (const e of st.egzemplarze.values()) {
      if (e.status === 'wydany' && (!p || normKlucz(e.projekt) === p)) w.push({ modelId: e.modelId, sn: e.sn, ilosc: 1, projekt: e.projekt, klient: e.klient, numer: e.wydanie && e.wydanie.numer });
    }
    for (const [k, ilosc] of st.wydane) {
      if (ilosc < 1e-9) continue;
      const i = k.lastIndexOf('|');
      const proj = k.slice(0, i);
      const modelId = k.slice(i + 1);
      if (!p || normKlucz(proj) === p) w.push({ modelId, sn: '', ilosc, projekt: proj, klient: st.wydaneKlient.get(k) || '' });
    }
    return w;
  }

  function dokumentyLista(st) {
    return Array.from(st.dokumenty.values()).sort((a, b) => (a.ev.ts < b.ev.ts ? 1 : -1));
  }

  function podpowiedzi(st) {
    const klienci = new Set();
    for (const k of st.klienci.values()) if (k.nazwa) klienci.add(k.nazwa);
    for (const { ev } of st.dokumenty.values()) if (ev.dane.klientNazwa) klienci.add(ev.dane.klientNazwa);
    const dostawcy = new Set();
    for (const { ev } of st.dokumenty.values()) if (ev.dane.dostawca) dostawcy.add(ev.dane.dostawca);
    const producenci = new Set();
    for (const m of st.modele.values()) if (m.producent) producenci.add(m.producent);
    const sortuj = (s) => Array.from(s).filter(Boolean).sort((a, b) => a.localeCompare(b, 'pl'));
    return { lokalizacje: sortuj(st.lokalizacje), projekty: sortuj(st.projekty), klienci: sortuj(klienci), dostawcy: sortuj(dostawcy), producenci: sortuj(producenci) };
  }

  /** Czy wartość jest nowa (nie występowała) – do potwierdzania nowych lokalizacji/projektów. */
  function czyNowaWartosc(lista, wartosc) {
    const k = normKlucz(wartosc);
    return !!k && !lista.some((x) => normKlucz(x) === k);
  }

  function opisZdarzenia(st, ev) {
    const d = ev.dane || {};
    switch (ev.typ) {
      case 'DOK': return (RODZAJE[d.rodzaj] || {}).nazwa + ' ' + d.numer + (d.projekt ? ' · projekt ' + d.projekt : '') + ' · ' + (d.pozycje || []).length + ' poz.';
      case 'ANUL': return 'Anulowano ' + (d.numer || '') + ' · powód: ' + (d.powod || '');
      case 'PRZENIES': return 'Przeniesiono ' + opisModelu(st, d.modelId) + (d.sn ? ' SN ' + d.sn : ' · ' + d.ilosc + ' ' + jm(st, d.modelId)) + ' z „' + d.z + '” do „' + d.do + '”';
      case 'SKAN': return 'Dołączono skan do ' + (d.numer || '') + ': ' + d.plik;
      case 'UZUP': return 'Oznaczono jako uzupełnione: ' + (d.numer || '') + ' poz. ' + (Number(d.idx) + 1) + (d.uwagi ? ' · ' + d.uwagi : '');
      case 'MODEL': return 'Kartoteka: ' + (d.producent ? d.producent + ' ' : '') + (d.model || opisModelu(st, d.modelId)) + (d.kartaPlik || d.link ? ' (z kartą katalogową)' : '');
      case 'KLIENT': return 'Klient: ' + (d.nazwa || d.klientId);
      case 'UZYTK': return 'Użytkownik: ' + (d.imie || '') + ' ' + (d.nazwisko || '') + (d.aktywny === false ? ' (dezaktywowany)' : '');
      default: return ev.typ;
    }
  }

  return {
    WERSJA, RODZAJE, KATEGORIE, STANY_TECHNICZNE,
    canonical, sha256hex, zapieczetuj, sprawdzPieczec, noweId, zaokr, norm, normKlucz, hashPin,
    formatNumer, nazwaPlikuDokumentu, sciezkaZdarzenia, czyPoprawnaNazwaPliku,
    zbudujStan, noweZdarzenie, nastepnyNumer, przygotujDokument, sprawdzNowe, walidujDokument, czyZastepcze,
    stanyModeli, wierszeMagazynu, wydaneNaProjekt, dokumentyLista, podpowiedzi, czyNowaWartosc, opisZdarzenia, opisModelu,

/* src/xlsx.js */
/*
 * Minimalny zapis plików .xlsx (jeden arkusz, tekst i liczby, pogrubiony nagłówek).
 * Bez zewnętrznych bibliotek: pliki XML pakowane do ZIP bez kompresji.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.MagazynXlsx = factory();

  'use strict';

  const TABELA_CRC = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bajty) {
    let c = 0xffffffff;
    for (let i = 0; i < bajty.length; i++) c = TABELA_CRC[(c ^ bajty[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  function zip(pliki) {
    // pliki: [{nazwa, dane: Uint8Array}]
    const enc = new TextEncoder();
    const czesci = [];
    const katalog = [];
    let przesuniecie = 0;
    const dosTime = 0, dosDate = (2026 - 1980) << 9 | 1 << 5 | 1;
    for (const p of pliki) {
      const nazwa = enc.encode(p.nazwa);
      const crc = crc32(p.dane);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true); // UTF-8
      lh.setUint16(8, 0, true); // bez kompresji
      lh.setUint16(10, dosTime, true);
      lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, p.dane.length, true);
      lh.setUint32(22, p.dane.length, true);
      lh.setUint16(26, nazwa.length, true);
      lh.setUint16(28, 0, true);
      czesci.push(new Uint8Array(lh.buffer), nazwa, p.dane);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true);
      ch.setUint16(12, dosTime, true);

      ch.setUint32(42, przesuniecie, true);

    }
    const rozmiarKatalogu = katalog.reduce((s, b) => s + b.length, 0);
    const koniec = new DataView(new ArrayBuffer(22));
    koniec.setUint32(0, 0x06054b50, true);
    koniec.setUint16(8, pliki.length, true);
    koniec.setUint16(10, pliki.length, true);
    koniec.setUint32(12, rozmiarKatalogu, true);

    const dl = wszystko.reduce((s, b) => s + b.length, 0);

  function esc(s) {

   * @param {string} arkusz nazwa arkusza
   * @param {string[]} naglowki

   * @param {string} [tytul] opis nad tabelą (np. data eksportu)
   */
  function utworz(arkusz, naglowki, wiersze, tytul) {
    const enc = new TextEncoder();
    const rows = [];
    let r = 1;
    const komorka = (c, v, styl) => {
      const ref = kolumna(c) + r;
      const s = styl ? ' s="' + styl + '"' : '';
      if (v === null || v === undefined || v === '') return '<c r="' + ref + '"' + s + '/>';
      if (typeof v === 'number' && isFinite(v)) return '<c r="' + ref + '"' + s + '><v>' + v + '</v></c>';
      return '<c r="' + ref + '"' + s + ' t="inlineStr"><is><t xml:space="preserve">' + esc(v) + '</t></is></c>';
    };
    if (tytul) {
      rows.push('<row r="' + r + '">' + komorka(0, tytul, 2) + '</row>');
      r += 2;
    }
    const wierszNaglowka = r;
    rows.push('<row r="' + r + '">' + naglowki.map((h, c) => komorka(c, h, 1)).join('') + '</row>');
    r++;
    for (const w of wiersze) {
      rows.push('<row r="' + r + '">' + w.map((v, c) => komorka(c, v, 0)).join('') + '</row>');
      r++;
    }
    const szer = naglowki.map((h, c) => {
      let m = String(h).length;
      for (const w of wiersze) m = Math.max(m, String(w[c] == null ? '' : w[c]).length);
      return Math.min(60, Math.max(8, m + 2));
    });
    const cols = '<cols>' + szer.map((s, c) => '<col min="' + (c + 1) + '" max="' + (c + 1) + '" width="' + s + '" customWidth="1"/>').join('') + '</cols>';
    const ostatnia = kolumna(Math.max(0, naglowki.length - 1)) + Math.max(wierszNaglowka, r - 1);
    const sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="' + wierszNaglowka + '" topLeftCell="A' + (wierszNaglowka + 1) + '" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
      cols + '<sheetData>' + rows.join('') + '</sheetData>' +
      '<autoFilter ref="A' + wierszNaglowka + ':' + ostatnia + '"/>' +
      '</worksheet>';
    const nazwaArkusza = esc(String(arkusz).replace(/[\\/?*[\]:]/g, ' ').slice(0, 31) || 'Arkusz1');
    const pliki = [
      { nazwa: '[Content_Types].xml', tekst: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
      { nazwa: '_rels/.rels', tekst: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
      { nazwa: 'xl/workbook.xml', tekst: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="' + nazwaArkusza + '" sheetId="1" r:id="rId1"/></sheets></workbook>' },
      { nazwa: 'xl/_rels/workbook.xml.rels', tekst: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
      { nazwa: 'xl/styles.xml', tekst: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="13"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFFE17A"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border/><border><bottom style="thin"><color rgb="FF888888"/></bottom></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' },
      { nazwa: 'xl/worksheets/sheet1.xml', tekst: sheet },
    ];
    return zip(pliki.map((p) => ({ nazwa: p.nazwa, dane: enc.encode(p.tekst) })));
  }

  return { utworz, crc32, zip };
